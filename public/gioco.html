  {t:"Gli chiedi il segreto del pane",e:{a:4},r:"«Il lievito di mia nonna. Ha 70 anni.» Il lievito, non la nonna. Forse entrambi."}]},
 {q:"Senza sapere come, finisci sul tetto di un palazzo con altre sei persone. Nessuno si conosce. Tutti guardano il tramonto in silenzio.",w:[2],c:[
  {t:"Resti in silenzio con loro",e:{a:8,T:{aura:6}},r:"Il sole tramonta. Qualcuno applaude piano. Poi tutti scendono senza dirsi niente. Una cosa che non saprai spiegare a nessuno."},
  {t:"Fai una foto di gruppo",e:{f:6,fa:1},r:"Sette sconosciuti, un tramonto. Nei commenti chiedono «chi sono?». Non lo sai neanche tu."},
  {t:"Chiedi chi ha organizzato",e:{c:2,a:2},r:"Si guardano tutti. Nessuno. Brividi."}]},
 {q:"Un aquilone rosso cade ai tuoi piedi. Il filo è lungo, lunghissimo, e porta oltre i tetti.",c:[
  {t:"Segui il filo",e:{b:-8,a:5,fa:2},r:"Dopo mezz'ora trovi un bambino in lacrime su una collina. Gli riporti l'aquilone. Ti guarda come un supereroe."},
  {t:"Lo fai volare tu",e:{T:{gym:3},f:3},r:"Corri, salta, vola. Per dieci minuti hai di nuovo 8 anni."},
  {t:"Lo appendi a un ramo, ben visibile",e:{a:3},r:"Il giorno dopo non c'è più. Al suo posto c'è un bigliettino: «Grazie.»"}]},
 {q:"Il vento ti fa volare via un foglio dalla tasca. Lo rincorri fino a una panchina dove una signora lo sta già leggendo. Era la tua lista della spesa.",c:[
  {t:"Ti presenti e ridete insieme",e:{fa:2,a:3},r:"«Hai dimenticato il latte», ti dice. Era vero. Ti offre una caramella alla menta."},
  {t:"Le chiedi di aggiungere qualcosa alla lista",e:{f:2,c:2},r:"Scrive «un po' di coraggio». Lo compri sempre, da oggi."},
  {t:"Lo riprendi con dignità",e:{a:2},r:"Lei te lo porge come un diploma. Esci a testa alta, senza il latte."}]},
 {q:"Segui un odore di zucchero bruciato e trovi una bancarella che non c'era mai stata: «Dolci di un altro tempo». Il venditore ha un cappello a cilindro.",c:[
  {t:"Compri il dolce più strano",need:3,e:{s:-3,b:10,a:3},r:"Sa di mela, cannella e di un'estate che non hai mai vissuto. Strano. Bellissimo."},
  {t:"Chiedi da dove viene",e:{a:4,c:2},r:"«Da dietro l'angolo», dice. Ti giri: dietro l'angolo c'è solo un muro."},
  {t:"Fai una storia sulla bancarella",e:{f:6,T:{insta:4}},r:"La storia viene vista da 300 persone. Il giorno dopo la bancarella non c'è più. Nessuno la ritrova."}]},
 {q:"Ti ritrovi davanti alla tua vecchia scuola elementare. Il cancello è aperto e la bidella è la stessa di 10 anni fa.",w:[1,2],c:[
  {t:"Entri a salutarla",e:{fa:6,a:3},r:"Si ricorda il tuo nome e la volta che hai mangiato la colla. Vi abbracciate. Ti manca un po' tutto."},
  {t:"Guardi da fuori il cortile",e:{a:4},r:"Lo scivolo sembra piccolissimo. Ti ricordi di quando era un grattacielo."},
  {t:"Fai il video «torno alle elementari»",e:{f:8,T:{insta:5}},r:"La bidella saluta in camera: «Ciao, bimbo!» Commenti commossi."}]},
 {q:"Un cane senza collare ti guarda, abbaia una volta e inizia a camminare. Si ferma e si gira: vuole che lo segui.",c:[
  {t:"Lo segui",e:{T:{pet:6},b:-6},r:"Ti porta fino a una signora che lo stava cercando da ore. «Vagabondo, chi hai portato?» Ti offre un caffè."},
  {t:"Gli dai un pezzo di panino",e:{T:{pet:4},fa:1},r:"Lo mangia, ti lecca la mano e se ne va soddisfatto. Missione compiuta, almeno per lui."},
  {t:"Chiami il canile per sicurezza",e:{T:{pet:3},a:3},r:"Ha il microchip. Torna a casa in un'ora. Ti mandano la foto del cane sul divano."}]},
 {q:"In un parcheggio vuoto qualcuno ha disegnato col gesso un'enorme campana. In fondo c'è scritto: «Solo per chi passa di qui per caso».",c:[
  {t:"Ci giochi",e:{fa:2,T:{gym:2},a:3},r:"Salti fino al cielo senza toccare le righe. Una signora dal balcone applaude."},
  {t:"Aggiungi una casella con un disegno tuo",e:{f:2,a:4},r:"Disegni un cuore. Il giorno dopo qualcuno ne ha aggiunta un'altra. La campana cresce."},
  {t:"Fai la foto e vai",e:{f:3},r:"La campana resta lì, ad aspettare il prossimo."}]},
 {q:"Il vento ti porta alla fermata di un autobus che non hai mai preso. Arriva subito. Sul display c'è scritto solo: «Giro panoramico».",c:[
  {t:"Sali",need:2,e:{s:-2,a:5,b:4},r:"Un'ora di giro tra colline, cascine e paesi sconosciuti. Torni al punto di partenza con un'idea nuova in testa."},
  {t:"Chiedi all'autista dove va",e:{c:2,a:2},r:"«Dove deve.» Chiude le porte e parte. Non saprai mai dove."},
  {t:"Ti siedi alla fermata a guardare",e:{b:6},r:"L'autobus parte vuoto. Ti senti come in un film francese."}]},
 {q:"Trovi una cabina telefonica dimenticata. Il telefono squilla appena ti avvicini.",c:[
  {t:"Rispondi",e:{a:6,c:3},r:"Una voce dice: «Finalmente! Il pacco è pronto, lo ritiri tu?» Poi riattacca. Nessun pacco. Nessuna spiegazione."},
  {t:"Fai il video mentre squilla",e:{f:9,T:{insta:5}},r:"Il video diventa virale come «il telefono che chiama solo te». Tre youtuber vengono a cercarlo."},
  {t:"Ti allontani di corsa",e:{b:-4,c:2},r:"Dopo dieci metri smette di squillare. Non ti giri."}]},
 {q:"Seguendo la musica arrivi a una festa di matrimonio in un cortile. Ti scambiano per un cugino lontano. Ti mettono un piatto in mano.",w:[2,3],m:[5,6,7,8,9],c:[
  {t:"Stai al gioco e balli con la nonna della sposa",e:{fa:3,b:-6,f:4},r:"Balli il liscio, mangi la torta, firmi il libro degli invitati. La sposa ti ringrazia di essere venut{GO} «da così lontano»."},
  {t:"Spieghi l'equivoco",e:{a:4},r:"Ridono tutti. Ti fanno restare lo stesso: «A un matrimonio un posto in più c'è sempre.»"},
  {t:"Prendi un confetto e scappi",e:{c:3,b:4},r:"Ti inseguono due zie col sacchetto della bomboniera. Ti raggiungono. Ora hai una bomboniera."}]},
 {q:"In una via secondaria trovi una libreria piccolissima. Il libraio ti dà un libro senza chiederti niente: «Questo è tuo. Lo riporti quando l'hai finito.»",c:[
  {t:"Lo prendi e lo leggi davvero",e:{a:8,T:{aura:6},b:-4},r:"Lo finisci in due notti. Sembra scritto per te. Quando lo riporti, il libraio ne ha già pronto un altro."},
  {t:"Chiedi perché proprio quello",e:{a:4},r:"«Perché sei passat{GO} di qui.» Nessun'altra spiegazione."},
  {t:"Lo rifiuti con gentilezza",e:{a:1},r:"Il libraio annuisce. «Tornerai.» Ha ragione, in un certo senso."}]},
 {q:"Una pioggia improvvisa ti spinge sotto una tettoia. Accanto a te c'è il tuo vecchio migliore amico delle medie, che non vedi da anni.",c:[
  {t:"Vi raccontate tutto, finché smette di piovere",e:{fa:3,a:4},do:()=>addFriend(),r:"Smette di piovere dopo un'ora. Non ve ne accorgete. Vi scambiate i numeri come se fosse ieri."},
  {t:"Un saluto veloce, un po' imbarazzato",e:{c:2},r:"«Ci sentiamo, eh.» Non vi sentirete. Ma per un momento è stato bello."},
  {t:"Proponi di andare a prendere un cioccolata",need:4,e:{s:-4,fa:2,a:3},do:()=>addFriend(),r:"Cioccolata densa, vecchi ricordi e risate. Un'amicizia che ricomincia."}]},
 {q:"Il vento ti porta su un ponte. Sotto passa un fiume calmo. Sul parapetto qualcuno ha attaccato centinaia di bigliettini con dei desideri.",c:[
  {t:"Scrivi anche tu il tuo desiderio",e:{a:5,fa:1},r:"Lo leghi bene. Non lo dici a nessuno. È così che funziona."},
  {t:"Ne leggi qualcuno",e:{a:3,c:1},r:"«Vorrei che mia nonna guarisse.» «Vorrei un cane.» «Vorrei vincere al fanta.» L'umanità in un ponte."},
  {t:"Foto del ponte al tramonto",e:{f:7,T:{insta:5}},r:"I bigliettini colorati controluce. Il post più poetico del tuo profilo."}]},
 {q:"Un signore in giacca e cravatta sta giocando a scacchi da solo su una panchina. Ti indica la sedia vuota.",c:[
  {t:"Giochi la partita",ok:()=>S.st.a>=40||Math.random()<.3,e:{a:8,T:{aura:6,crypto:3}},r:"Partita lunga e silenziosa. Pareggio. Ti stringe la mano: «Raro, raro.»",rf:"Scacco matto in 7 mosse. Ti spiega con calma dove hai sbagliato. Lezione gratuita di umiltà.",ef:{a:3}},
  {t:"Gli chiedi perché gioca da solo",e:{fa:2,a:3},r:"«Aspetto qualcuno da quarant'anni. Oggi sei tu.» Non capisci, ma ti commuovi un po'."},
  {t:"Fai il tifo senza giocare",e:{f:2},r:"Vince il nero. Cioè lui. Esulta. Contro se stesso."}]},
 {q:"Senti un profumo di gelsomino e finisci davanti a un giardino segreto tra due palazzi. Una nonna sta annaffiando i fiori.",m:[4,5,6,7,8,9],c:[
  {t:"Le chiedi se puoi aiutarla",e:{fa:6,a:3},r:"Mezz'ora di annaffiatoio. Alla fine ti regala una piantina di basilico «per la mamma»."},
  {t:"Ti fermi solo a guardare",e:{a:4,b:4},r:"Profumi, colori, una farfalla. In mezzo al cemento, un angolo di paradiso."},
  {t:"Le chiedi il nome di ogni fiore",e:{a:3,fa:2},r:"Li conosce tutti, anche in latino. Ti fa una lezione di botanica. Ti piace più di quanto pensassi."}]},
 {q:"Il vento ti porta a un campetto di basket deserto. A terra c'è un pallone. Sul canestro c'è scritto: «Un tiro. Uno solo.»",c:[
  {t:"Tiri da lontano",ok:()=>Math.random()<.35+S.T.gym/200,e:{a:8,f:4},r:"Ciuff. Solo rete. Nessuno ti ha visto. Lo sai solo tu, ed è meglio così.",rf:"Il pallone prende il ferro e rotola via. Ma il cuore ti batte forte lo stesso.",ef:{a:2}},
  {t:"Tiro facile, da sotto",e:{a:3},r:"Canestro. Piccolo, sicuro, onesto."},
  {t:"Lasci il pallone a chi verrà dopo",e:{a:4},r:"Il tiro è per il prossimo. Ti sembra giusto."}]},
 {q:"Segui una scia di briciole di pane. Alla fine trovi un piccione enorme, che ti fissa come se stesse aspettando proprio te.",c:[
  {t:"Lo saluti con un inchino",e:{a:5,f:2},r:"Il piccione fa un passo avanti e un inchino a sua volta. Giuri che è successo davvero. Nessuno ti crede."},
  {t:"Gli dai il resto del pane",e:{T:{pet:3}},r:"Arrivano altri 40 piccioni. Fuggi."},
  {t:"Fai la battle di aura col piccione",e:{a:3,T:{aura:4},c:2},r:"Il piccione vince. Di nuovo. È il re della città."}]},
 {q:"Ti fermi davanti a una vetrina che riflette strano: nel riflesso hai dieci anni in più. Ti fai l'occhiolino da solo.",c:[
  {t:"Ti chiedi cosa farai a 29 anni",e:{a:6,T:{aura:5}},r:"Pensi a cosa vorresti essere. Non hai una risposta precisa. Ma ti piace la faccia che fai nel riflesso."},
  {t:"Ti sistemi i capelli e vai avanti",e:{a:2},r:"Era solo il vetro curvo di una gioielleria. Forse."},
  {t:"Fai una foto al riflesso",e:{f:5,c:2},r:"Nella foto sei normale. Il vetro ha scelto di mostrarlo solo a te."}]},
 {q:"Il vento ti porta su una collina sopra il paese. Da qui si vedono le luci di casa tua, la piazza, la stazione, il kebab.",w:[2,3],c:[
  {t:"Ti siedi e guardi per un'ora",e:{a:7,b:6},r:"Il paese sembra piccolissimo, e tu sembri grande. È una sensazione nuova. Te la porti a casa."},
  {t:"Chiami qualcuno per dirglielo",e:{fa:4},do:()=>{if(S.partner){S.partner.rel=Math.min(100,S.partner.rel+6);S.partner.last=S.day;}},r:"Al telefono non trovi le parole giuste. Non importa: dall'altra parte capiscono lo stesso."},
  {t:"Foto panoramica notturna",e:{f:7,T:{insta:4}},r:"Luci come stelle a terra. Una delle foto più belle che hai mai fatto."}]},
 {q:"In mezzo alla piazza vuota trovi un pianoforte a coda. Nessuno intorno. Un cartello dice: «Suonami».",c:[
  {t:"Suoni l'unica canzone che sai",e:{a:5,f:4},r:"«Fra Martino» con due dita. Dalle finestre qualcuno applaude. È il tuo concerto."},
  {t:"Aspetti che arrivi qualcuno a suonare",e:{a:4,b:4},r:"Dopo mezz'ora arriva un ragazzino che suona Chopin. Rimani a bocca aperta."},
  {t:"Fai il video del pianoforte vuoto",e:{f:6,T:{insta:4}},r:"«Il pianoforte che aspetta.» I commenti propongono canzoni. Domani qualcuno le suonerà."}]},
 {q:"Il vento ti porta davanti a una porta socchiusa da cui esce odore di sugo. Una voce dall'interno: «Sei arrivat{GO}? A tavola!»",w:[1,2],c:[
  {t:"Entri, per curiosità",e:{fa:3,b:10,c:2},r:"Una famiglia intera ti accoglie come se fossi atteso. Mangi lasagne. Solo alla fine capiscono che aspettavano un altro. Ti danno comunque il dolce."},
  {t:"Rispondi che hanno sbagliato persona",e:{a:3},r:"Ridono, ti invitano lo stesso «per la prossima domenica». Forse ci andrai."},
  {t:"Annusi e vai avanti, affamat{GO}",e:{b:-4},r:"Corri a casa a fare un piatto di pasta. Non è la stessa cosa. Ma ci provi."}]},
 {q:"Un ragazzo con una macchina fotografica a pellicola ti chiede se può farti un ritratto. «Mi piace la luce che hai addosso.»",c:[
  {t:"Accetti e posi in modo naturale",e:{f:5,a:5},r:"Uno scatto solo. «Te lo mando quando lo sviluppo.» Tre settimane dopo ti arriva una foto bellissima. Non sembri tu. Sei tu."},
  {t:"Fai la posa da sigma",e:{f:4,c:3,T:{maranza:3}},r:"Sospira e scatta lo stesso. La foto è ridicola. La appendi in camera."},
  {t:"Gli chiedi di fargli tu una foto",e:{a:4,fa:1},r:"Lui ride: «Nessuno me l'aveva mai chiesto.» Gli fai una foto con il tuo telefono. Si commuove."}]}
];
const EVW_REG={
 lombardia:[{q:"La nebbia è così fitta che ti perdi nel tuo paese. Quando si dirada sei davanti a una cascina antica, con una {SCIURA} che fa la polenta nel paiolo.",m:[10,11,12,1,2],c:[{t:"Ti fermi a mangiare",e:{fa:4,b:10},r:"Polenta e formaggio fuso, accanto al camino. «Da dove arrivi?» «Dalla nebbia.» Lei annuisce: capisce."},{t:"Chiedi la strada per tornare",e:{a:2},r:"«Segui la roggia.» Non sai cos'è una roggia. La segui lo stesso. Funziona."},{t:"Foto della cascina nella nebbia",e:{f:7,T:{insta:5}},r:"Sembra un quadro dell'Ottocento. Nessuno capisce dove sia. Nemmeno tu."}]}],
 veneto:[{q:"Il vento ti porta in un bacaro nascosto dietro una calle. L'oste ti riconosce: «Ciò, ti xe el nipote de chi?» Non vi siete mai visti.",c:[{t:"Dici il cognome dei tuoi",e:{fa:4,a:3},r:"«Ah! Me ricordo to nonno!» Cicchetto offerto e una storia sul nonno che non conoscevi."},{t:"«Sono di passaggio»",e:{a:3},r:"«Qua nissun xe de passagio.» Ti fa sedere e ti racconta la storia del locale."},{t:"Ordini un'ombra di succo d'uva",need:2,e:{s:-2,fa:2},r:"L'oste ride e te la serve nel bicchiere buono. Rispetto."}]}],
 piemonte:[{q:"Seguendo l'odore di nocciole tostate arrivi a una piccola fabbrica di gianduiotti aperta per errore. Il pasticcere ti guarda: «Lei chi è, neh?»",c:[{t:"Ti presenti con educazione",e:{a:4,fa:2},r:"Ti offre un gianduiotto appena fatto. «Non dica a nessuno che è entrato, neh.» Non lo dirai."},{t:"Chiedi la ricetta segreta",e:{c:2},r:"Sorriso piemontese. Silenzio. Cambio di argomento sul meteo."},{t:"Compri una scatola per la nonna",need:8,e:{s:-8,fa:8},r:"La nonna la apre, ne mangia tre, e nasconde il resto. Classico."}]}],
 lazio:[{q:"Il vento ti porta in una piazzetta di {METRO} che non c'è sulle mappe. Un signore ti offre un supplì: «Daje, che te lo meriti.»",c:[{t:"Lo accetti",e:{b:8,fa:2},r:"Filo di mozzarella lungo un metro. «Hai visto? Se chiama supplì ar telefono.» Lo sapevi, ma fai finta di no."},{t:"Gli chiedi perché te lo meriti",e:{a:4},r:"«Perché sei passat{GO} de qua. Mica ce passa nessuno.»"},{t:"Foto della piazzetta",e:{f:7,T:{insta:5}},r:"Edera, fontanella, un gatto sul muretto. Tutti ti chiedono dov'è. Non lo dirai mai."}]}],
 campania:[{q:"Seguendo un mandolino arrivi in un vicolo dove una nonna stende i panni e canta. I panni formano un arcobaleno sopra la tua testa.",c:[{t:"Canti con lei",e:{fa:4,a:4},r:"Non sai le parole, ma lei ti insegna il ritornello. Dai balconi cantano anche i vicini."},{t:"Le offri un caffè al bar sotto",need:2,e:{s:-2,fa:6},r:"Lei accetta, poi lo paga lei. «Che bella creatura.» Ti tiene a braccetto fino al bar."},{t:"Foto dell'arcobaleno di panni",e:{f:8,T:{insta:5}},r:"La foto più colorata del tuo profilo. «Napoli in una foto», scrive qualcuno."}]}],
 calabria:[{q:"Il vento ti porta su una spiaggia deserta al tramonto. Un pescatore ripara le reti e ti fa cenno di sederti.",c:[{t:"Ti siedi e lo aiuti",e:{fa:3,a:5},r:"Ti insegna un nodo che conosce da sessant'anni. Alla fine ti regala due pesci per cena."},{t:"Gli chiedi della sua vita",e:{a:4,fa:2},r:"Ti racconta di tempeste, di amori e di un pesce spada «grande come una barca». Forse esagera. Non importa."},{t:"Guardi il mare in silenzio",e:{a:6,b:6},r:"Il sole scende dietro le isole lontane. Il pescatore dice solo: «Bellu.» Basta così."}]}],
 sicilia:[{q:"Seguendo il profumo di zagara arrivi in un agrumeto. Un contadino ti lancia un'arancia: «Assaggia, picca e niente!»",c:[{t:"La mangi lì, sotto l'albero",e:{b:8,a:4},r:"Dolce come il miele, il succo ti cola fino al gomito. «Chista è a Sicilia», dice lui."},{t:"Lo aiuti a raccoglierle",e:{fa:3,b:-6},r:"Torni a casa con una cassetta di arance. La nonna fa la granita. Giornata perfetta."},{t:"Foto dell'agrumeto con l'Etna sullo sfondo",e:{f:8,T:{insta:5}},r:"Arance, cielo blu, vulcano. Non serve nessun filtro."}]}],
 sardegna:[{q:"Il vento ti porta su una scogliera. Un pastore con le pecore suona le launeddas guardando il mare.",c:[{t:"Ascolti fino alla fine",e:{a:7,T:{aura:4}},r:"Una musica antica come i nuraghi. Il pastore ti saluta con il bastone e se ne va con le pecore."},{t:"Provi a suonare",e:{c:3,f:3},r:"Esce un suono da papera. Il pastore ride così tanto che le pecore scappano."},{t:"Video del pastore e del mare",e:{f:8,T:{insta:5}},r:"Il video più bello che tu abbia mai fatto. Lo guardi tre volte prima di postarlo."}]}]
};

const GUIDA_Q=["Autoscuola «La Precedenza». L'istruttore ti accoglie col caffè in mano e lo sguardo di chi ha visto troppi neopatentati.","All'autoscuola c'è la classe del foglio rosa: metà ripassa i quiz, metà guarda TikTok di incidenti.","L'istruttore ti mostra la macchina coi doppi comandi: «Questo pedale è il mio migliore amico.»","In bacheca: «Promossi del mese». C'è un solo nome. È del 2019.","Un ragazzo esce dall'esame piangendo. Non si capisce se di gioia o di disperazione.","L'istruttore: «Oggi parliamo di rotonde. Mettetevi comodi, ci vorrà un po'.»"];
const GUIDA_DONE=[
 {q:"Torni all'autoscuola con la patente in tasca. L'istruttore ti riconosce e impallidisce.",c:[
  {t:"Gli offri un caffè per ringraziarlo",need:2,e:{s:-2,fa:3},r:"Lo accetta. «Guida piano, mi raccomando.» Lo dice a tutti, ma a te di più."},
  {t:"Fai il figo coi ragazzi del foglio rosa",e:{a:4,c:2,T:{maranza:5}},r:"Racconti di come hai passato l'esame «al primo colpo». Era il secondo."},
  {t:"Corso di guida sicura (25 €)",need:25,e:{s:-25,fa:5,a:2},r:"Testacoda controllato in pista. Per la prima volta guidi come un adulto."}]},

function makeCall(){
 const pool=CALLS.filter(x=>!x.ok||x.ok());const C=pick(pool);const n=C.who();
 return{q:`📞 Chiamata da ${n}. ${C.q(n)}`,c:C.c.map(c=>({...c,free:true,do:c.do?(()=>c.do(n)):undefined}))};
}
function pingMaybe(){
 S.lastPing=S.lastPing||0;const t=S.day*4+S.ph;
 if(S.ping||t-S.lastPing<4||Math.random()>.12)return;

 if(allP().length<3&&!S.flMatch&&Math.random()<.45){const P=flProfile();S.flMatch={n:P.n,pref:P.pref,opts:FL_OPEN.filter(o=>!o.pref||o.pref===P.pref||o.pref===S.type).sort(()=>Math.random()-.5).slice(0,3)};S.ping={k:'match',n:P.n};}
 else{const ev=makeCall();S.ping={k:'call',ev,n:ev.q.match(/Chiamata da ([^.]+)\./)[1]};}
}

const LS={get(k,d){try{const v=localStorage.getItem('mb_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},

/* ---------- Backend account (simulato in locale, stessa interfaccia del server futuro) ---------- */
const Backend={
 async hash(pw,salt){try{const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
   const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
   return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){let h=0;for(const ch of salt+pw)h=(h*31+ch.charCodeAt(0))|0;return 'x'+h;}},
 users(){return LS.get('users',{});},
 async register(email,pw,nick,age){email=email.trim().toLowerCase();const U=this.users();if(U[email])throw new Error('Esiste già un account con questa email.');
  const salt=crypto.getRandomValues?[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16)).join(''):String(Math.random());
  U[email]={nick,salt,hash:await this.hash(pw,salt),created:Date.now(),age,terms:Date.now(),tv:LEGAL.version};
  if(!LS.set('users',U))throw new Error('Spazio di salvataggio non disponibile su questo browser.');LS.set('session',email);return email;},
 async login(email,pw){email=email.trim().toLowerCase();const u=this.users()[email];if(!u||u.hash!==await this.hash(pw,u.salt))throw new Error('Email o password non corretti.');LS.set('session',email);return email;},
 logout(){LS.del('session');},
 current(){const e=LS.get('session',null);return e&&this.users()[e]?e:null;},
 profile(){const e=this.current();return e?{email:e,...this.users()[e]}:null;},
 save(data){const e=this.current();if(!e)return false;return LS.set('save:'+e,{at:Date.now(),v:1,data});},
 load(){const e=this.current();return e?LS.get('save:'+e,null):null;},
 deleteSave(){const e=this.current();if(e)LS.del('save:'+e);},
 deleteAccount(){const e=this.current();if(!e)return;const U=this.users();delete U[e];LS.set('users',U);LS.del('save:'+e);LS.del('session');},
 exportData(){const p=this.profile();if(!p)return null;const {hash,salt,...rest}=p;return {account:rest,salvataggio:this.load(),consenso:LS.get('consent',null),fascia_eta:LS.get('age',null)};}
};

/* ---------- Salvataggi online (Cloudflare). Se il server non c'è, resta tutto sul dispositivo. ---------- */
const Cloud={
 tok(){return LS.get('tok',null);},
 async call(path,method,data){
  if(!/^https?:$/.test(location.protocol))return {off:true};
  let r;
  try{r=await fetch('/api/'+path,{method,headers:{'content-type':'application/json',...(this.tok()?{authorization:'Bearer '+this.tok()}:{})},body:data===undefined?undefined:JSON.stringify(data)});}
  catch(e){return {off:true};}
  const ct=r.headers.get('content-type')||'';
  if(!ct.includes('application/json'))return {off:true};
  const j=await r.json().catch(()=>({}));
  if(!r.ok)return {error:j.error||'Errore del server.',status:r.status};
  return j;
 },
 _t:null,
 push(at,data){clearTimeout(this._t);this._t=setTimeout(()=>{if(this.tok())this.call('save','PUT',{at,data});},1500);}
};
(function(){
 const reg=Backend.register.bind(Backend),log=Backend.login.bind(Backend),sav=Backend.save.bind(Backend),out=Backend.logout.bind(Backend),del=Backend.deleteAccount.bind(Backend);
 Backend.register=async function(email,pw,nick,age){
  const r=await Cloud.call('register','POST',{email,pw,nick,age,tv:LEGAL.version});
  if(r.error)throw new Error(r.error);
  if(!r.off){LS.set('tok',r.token);const e=r.email;const U=this.users();U[e]={nick,cloud:true,created:Date.now(),age,terms:Date.now(),tv:LEGAL.version};LS.set('users',U);LS.set('session',e);return e;}
  return reg(email,pw,nick,age);
 };
 Backend.login=async function(email,pw){
  const r=await Cloud.call('login','POST',{email,pw});
  if(r.error)throw new Error(r.error);
  if(!r.off){
   LS.set('tok',r.token);const e=r.email;const U=this.users();U[e]={...(U[e]||{}),nick:r.nick,cloud:true};LS.set('users',U);LS.set('session',e);
   const s=await Cloud.call('save','GET');const loc=LS.get('save:'+e,null);
   if(s&&s.data&&(!loc||s.at>loc.at))LS.set('save:'+e,{at:s.at,v:1,data:s.data});
   return e;
  }
  return log(email,pw);
 };
 Backend.save=function(data){const ok=sav(data);const e=this.current();if(ok&&e&&this.users()[e].cloud){const s=LS.get('save:'+e,null);if(s)Cloud.push(s.at,s.data);}return ok;};
 Backend.logout=function(){if(Cloud.tok())Cloud.call('logout','POST',{});LS.del('tok');out();};
 Backend.deleteAccount=function(){const e=this.current();if(e&&this.users()[e]&&this.users()[e].cloud)Cloud.call('account','DELETE');LS.del('tok');del();};
})();

  <div style="font-size:15px;line-height:1.5">Prima di iniziare: quanti anni hai?</div>
  <div style="font-size:12px;color:#A3A8B4;margin-top:-4px">Serve per mostrarti la pubblicità giusta e rispettare la legge. Non lo chiediamo per altro.</div>
  <button class="chip" data-age="u14" style="min-height:52px">Meno di 14</button>
  <button class="chip" data-age="minor" style="min-height:52px">Tra 14 e 17</button>
  <button class="chip" data-age="adult" style="min-height:52px">18 o più</button>`);
 app.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{const a=b.dataset.age;
  if(a==='u14'){pScreen(`<div class="h" style="font-size:24px">Ci vediamo più avanti</div><div style="font-size:14px;line-height:1.5;color:#C9CCD3">Bottaranza è pensato per chi ha almeno 14 anni: è una satira con battute e situazioni da grandi.</div><button class="cta" id="bk">Torna indietro</button>`);document.getElementById('bk').onclick=ageGate;return;}
  LS.set('age',a);boot();});
}
function consentScreen(next){
 const minor=LS.get('age',null)==='minor';const c=LS.get('consent',{store:true,pers:true,meas:true});
 if(minor){pScreen(`<div class="h" style="font-size:22px">Pubblicità e privacy</div><div style="font-size:14px;line-height:1.5;color:#C9CCD3">Bottaranza è gratis grazie alla pubblicità. Visto che hai meno di 18 anni vedrai solo <b>annunci non personalizzati</b>: non usiamo i tuoi dati per profilarti.</div>${linkBtn('pv','Leggi l\'informativa privacy')}<button class="cta" id="ok">Ho capito</button>`);
  document.getElementById('pv').onclick=()=>showLegal('privacy',()=>consentScreen(next));
  document.getElementById('ok').onclick=()=>{LS.set('consent',{v:LEGAL.version,at:Date.now(),store:true,pers:false,meas:true});next();};return;}
 pScreen(`<div class="h" style="font-size:22px">Pubblicità e privacy</div>
  <div style="font-size:14px;line-height:1.5;color:#C9CCD3">Bottaranza è gratis grazie alla pubblicità: video facoltativi con premio e una pubblicità a schermo intero ogni 2-3 settimane di gioco. Niente banner.</div>
  <div style="font-size:14px;line-height:1.5;color:#C9CCD3">Con il tuo consenso, noi e Google possiamo salvare e leggere informazioni sul dispositivo e usare i dati di utilizzo per mostrarti annunci personalizzati e misurarne l'efficacia. Puoi cambiare idea quando vuoi dal menu.</div>
  ${linkBtn('pv','Leggi l\'informativa privacy')}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="cta" id="rej" style="background:#E7E9EE;color:#14161C">Non accettare</button><button class="cta" id="acc" style="background:#E7E9EE;color:#14161C">Accetta</button></div>
  <button class="chip" id="opt">Gestisci le opzioni</button>`);
 document.getElementById('pv').onclick=()=>showLegal('privacy',()=>consentScreen(next));
 document.getElementById('acc').onclick=()=>{LS.set('consent',{v:LEGAL.version,at:Date.now(),store:true,pers:true,meas:true});next();};
 document.getElementById('rej').onclick=()=>{LS.set('consent',{v:LEGAL.version,at:Date.now(),store:false,pers:false,meas:false});next();};
 document.getElementById('opt').onclick=()=>consentOptions(next,c);
}
function consentOptions(next,c){
 const row=(k,t,d)=>`<label style="display:flex;gap:12px;align-items:flex-start;background:#171920;border:1.5px solid #2A2D36;border-radius:14px;padding:12px"><input type="checkbox" data-k="${k}" ${c[k]?'checked':''} style="width:22px;height:22px;margin-top:2px;accent-color:#C6F432"><span><b style="font-size:14px">${t}</b><br><span style="font-size:12px;color:#A3A8B4">${d}</span></span></label>`;
 pScreen(`<div class="h" style="font-size:22px">Gestisci le opzioni</div>
  ${row('store','Archiviare e leggere informazioni sul dispositivo','Necessario per qualsiasi annuncio che usi identificatori del dispositivo.')}
  ${row('pers','Annunci personalizzati','Annunci scelti in base all\'uso delle app. Senza, vedi annunci non personalizzati.')}
  ${row('meas','Misurazione degli annunci','Statistiche anonime su quanti annunci vengono visti.')}
  <button class="cta" id="sv">Salva le scelte</button>`);
 document.getElementById('sv').onclick=()=>{const o={v:LEGAL.version,at:Date.now()};app.querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.checked);if(!o.store)o.pers=false;LS.set('consent',o);next();};
}
function accountScreen(){
 const p=Backend.profile();
 if(p){const sv=Backend.load();
  pScreen(`<div class="h" style="font-size:26px">Ciao, ${esc(p.nick)}</div><div style="font-size:13px;color:#A3A8B4">Account: ${esc(p.email)} · i progressi vengono salvati</div>
   ${sv&&sv.data?`<div style="background:#171920;border:1.5px solid #2A2D36;border-radius:16px;padding:12px"><div style="font:700 15px Inter,sans-serif">${esc(sv.data.ch.name)} · ${esc(REG[sv.data.ch.reg||'lombardia'].REGION)}</div><div style="font-size:12px;color:#A3A8B4">Giorno ${sv.data.day} · ${sv.data.type==='neutro'?'NeutroBot':esc((TNAME[sv.data.type]||'')+'Bot')} · salvato ${new Date(sv.at).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div><button class="cta" id="cont">Continua la partita</button><button class="chip" id="newg">Nuova partita</button>`:`<button class="cta" id="newg">Crea il personaggio</button>`}
   <button class="chip" id="out">Esci dall'account</button>`);
  const c=document.getElementById('cont');if(c)c.onclick=()=>{if(loadGame())renderGame();else toast('Salvataggio non leggibile.');};
  document.getElementById('newg').onclick=()=>{if(sv&&sv.data&&!confirm('Iniziare una nuova partita? Quella salvata verrà sostituita.'))return;Account.mode='user';renderCreate();};
  document.getElementById('out').onclick=()=>{Backend.logout();accountScreen();};return;}
 pScreen(`<div class="h" style="font-size:28px">Botta<span style="color:#C6F432">ranza</span></div>
  <div style="font-size:15px;line-height:1.5">Come vuoi giocare?</div>
  <button class="cta" id="reg">Crea un account</button>
  <div style="font-size:12px;color:#A3A8B4;margin-top:-6px">Con un account i progressi vengono salvati.</div>
  <button class="chip" id="log" style="min-height:50px">Ho già un account</button>
  <button class="chip" id="gst" style="min-height:50px;background:transparent">Gioca come ospite</button>
  <div style="font-size:12px;color:#A3A8B4;margin-top:-6px">Senza account non salviamo niente: la partita si perde quando chiudi il gioco.</div>
  <div style="display:flex;gap:16px">${linkBtn('tm','Termini e condizioni')}${linkBtn('pv','Privacy')}</div>`);
 document.getElementById('reg').onclick=()=>registerScreen();
 document.getElementById('log').onclick=()=>loginScreen();
 document.getElementById('gst').onclick=()=>{Account.mode='guest';renderCreate();};
 document.getElementById('tm').onclick=()=>showLegal('terms',accountScreen);
 document.getElementById('pv').onclick=()=>showLegal('privacy',accountScreen);
}
const fld=(id,lab,type,ph,ac)=>`<label style="display:flex;flex-direction:column;gap:5px"><span class="lbl">${lab}</span><input id="${id}" type="${type}" placeholder="${ph}" autocomplete="${ac}" style="min-height:46px;border-radius:14px;border:1.5px solid #2A2D36;background:#171920;color:#fff;padding:0 12px;font:500 15px Inter,sans-serif"></label>`;
function registerScreen(fromGame){
 pScreen(`<div class="h" style="font-size:24px">Crea un account</div>
  ${fld('rn','Nickname','text','Come ti chiamano al parchetto?','nickname')}
  ${fld('re','Email','email','nome@esempio.it','email')}
  ${fld('rp','Password','password','Almeno 8 caratteri, con un numero','new-password')}
  ${fld('rp2','Ripeti la password','password','','new-password')}
  <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4"><input type="checkbox" id="ct" style="width:22px;height:22px;accent-color:#C6F432;flex-shrink:0"><span>Accetto i ${linkBtn('tm','Termini e condizioni')}</span></label>
  <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4"><input type="checkbox" id="cp" style="width:22px;height:22px;accent-color:#C6F432;flex-shrink:0"><span>Ho letto l'${linkBtn('pv','Informativa privacy')}</span></label>
  <div id="rerr" role="alert" style="color:#FCA5A5;font-size:13px;min-height:18px"></div>
  <button class="cta" id="rgo">Crea account</button><button class="chip" id="rbk">Indietro</button>`);
 const keep={};const snap=()=>['rn','re'].forEach(k=>keep[k]=document.getElementById(k).value);const back=()=>{registerScreen(fromGame);for(const k in keep)document.getElementById(k).value=keep[k];};
 document.getElementById('tm').onclick=e=>{e.preventDefault();snap();showLegal('terms',back);};
 document.getElementById('pv').onclick=e=>{e.preventDefault();snap();showLegal('privacy',back);};
 document.getElementById('rbk').onclick=()=>fromGame?renderGame():accountScreen();
 document.getElementById('rgo').onclick=async()=>{const v=k=>document.getElementById(k).value;const err=t=>document.getElementById('rerr').textContent=t;
  const nick=v('rn').trim(),em=v('re').trim(),pw=v('rp');
  if(nick.length<2)return err('Scegli un nickname di almeno 2 caratteri.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return err('Controlla l\'email.');
  if(pw.length<8||!/\d/.test(pw))return err('La password deve avere almeno 8 caratteri e un numero.');
  if(pw!==v('rp2'))return err('Le due password non coincidono.');
  if(!document.getElementById('ct').checked||!document.getElementById('cp').checked)return err('Per creare l\'account devi accettare i termini e leggere l\'informativa.');
  try{await Backend.register(em,pw,nick,LS.get('age','adult'));Account.mode='user';
   if(fromGame&&S){saveGame(true);toast('Account creato: la partita ora è salvata.');renderGame();}else accountScreen();}catch(e){err(e.message);}};
}
function loginScreen(){
 pScreen(`<div class="h" style="font-size:24px">Accedi</div>${fld('le','Email','email','nome@esempio.it','email')}${fld('lp','Password','password','','current-password')}
  <div id="lerr" role="alert" style="color:#FCA5A5;font-size:13px;min-height:18px"></div>
  <button class="cta" id="lgo">Accedi</button>${linkBtn('fg','Password dimenticata?')}<button class="chip" id="lbk">Indietro</button>`);
 document.getElementById('lbk').onclick=accountScreen;
 document.getElementById('fg').onclick=()=>{document.getElementById('lerr').textContent='Nell\'app riceverai un\'email per reimpostarla. Nel prototipo non è disponibile.';};
 document.getElementById('lgo').onclick=async()=>{try{await Backend.login(document.getElementById('le').value,document.getElementById('lp').value);Account.mode='user';accountScreen();}catch(e){document.getElementById('lerr').textContent=e.message;}};
}

/* ---------- Salvataggio ---------- */
const Account={mode:'guest'};
let _svT=0;
function saveGame(force){if(Account.mode!=='user'||!S||!Backend.current())return;const now=Date.now();if(!force&&now-_svT<800)return;_svT=now;
 const data=JSON.parse(JSON.stringify(S,(k,v)=>(k==='ev'||k==='res'||k==='_fired'||typeof v==='function')?undefined:v));Backend.save(data);}
function loadGame(){const sv=Backend.load();if(!sv||!sv.data)return false;S=sv.data;S.view='map';S.ev=null;Object.assign(C,S.ch);Account.mode='user';return true;}
setInterval(()=>saveGame(),5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame(true);});

/* ---------- Menu di gioco ---------- */
function showMenu(){
 const p=Backend.profile(),user=Account.mode==='user'&&p;
 sheet(`<div class="h" style="font-size:20px">Menu</div>
  <div style="font-size:12px;color:#A3A8B4;margin:2px 0 6px">${user?'Account: '+esc(p.email)+' · salvataggio automatico attivo':'Stai giocando come ospite: i progressi non vengono salvati.'}</div>
  ${user?'':btn('m_reg','Crea un account e salva questa partita')}
  ${btn('m_new','Nuova partita')}
  ${btn('m_cons','Privacy e pubblicità')}
  ${btn('m_terms','Termini e condizioni')}${btn('m_priv','Informativa privacy')}
  ${user?btn('m_exp','Scarica una copia dei miei dati')+btn('m_out','Esci dall\'account')+btn('m_del','Elimina l\'account'):btn('m_log','Accedi a un account')}
  <div style="font-size:11px;color:#6B7080;margin-top:12px">Bottaranza ${APPV} · pubblicità: ${Ads.label()}</div>`,m=>{
  const on=(id,f)=>{const b=m.querySelector(`[data-a="${id}"]`);if(b)b.onclick=f;};
  on('m_reg',()=>{m.remove();registerScreen(true);});
  on('m_log',()=>{if(S&&!confirm('Uscendo dalla partita ospite perderai i progressi. Continuare?'))return;m.remove();loginScreen();});
  on('m_new',()=>{if(!confirm(user?'Iniziare una nuova partita? Quella salvata verrà sostituita.':'Iniziare una nuova partita? Quella attuale andrà persa.'))return;m.remove();renderCreate();});
  on('m_cons',()=>{m.remove();consentScreen(()=>{renderGame();toast('Scelte sulla privacy aggiornate.');});});
  on('m_terms',()=>showLegal('terms',showMenu));on('m_priv',()=>showLegal('privacy',showMenu));
  on('m_exp',()=>{const d=Backend.exportData();sheet(`<div class="h" style="font-size:20px">I tuoi dati</div><div style="font-size:12px;color:#A3A8B4;margin:4px 0 8px">Copia questo testo per conservarlo. Nell'app arriverà come file.</div><textarea readonly style="width:100%;height:220px;background:#0E0F13;color:#C9CCD3;border:1.5px solid #2A2D36;border-radius:12px;font:11px monospace;padding:8px">${esc(JSON.stringify(d,null,1))}</textarea>`);});
  on('m_out',()=>{saveGame(true);Backend.logout();Account.mode='guest';S=null;m.remove();accountScreen();});
  on('m_del',()=>{if(!confirm('Eliminare l\'account e il salvataggio? L\'operazione non si può annullare.'))return;Backend.deleteAccount();Account.mode='guest';S=null;m.remove();accountScreen();toast('Account eliminato.');});
 });
}

boot();
for(const k in EV)EV[k].forEach((e,i)=>{e._id=k+'#'+i;});EVR.forEach((e,i)=>{e._id='R#'+i;});MERC_SP.forEach((e,i)=>{e._id='M#'+i;});
window.EVall=()=>({...EV,mercato:[...(EV.mercato||[]),...MERC_SP],strada:EVW});window.EVRall=()=>EVR;window.__dbg={Backend,Ads,LS,boot,showMenu,saveGame,loadGame,Account,renderCreate,renderGame,get S(){return S},goTo,choose,showPhone,showPet};
</script>

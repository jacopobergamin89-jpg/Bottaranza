e:{f:4,a:3},r:"«Il brevetto è nel cuore, neh.» Risposta perfetta."},{t:"Video «lo zucchero filato più piemontese»",e:{f:8,T:{insta:5}},r:"Lo ordinano in 30 dopo il tuo video. Il giostraio ti offre i giri gratis."}]}]},lazio:{barbiere:[{w:[0,1,2],q:"Il barbiere romano: «Allora, che famo? Er solito?» Non ci sei mai andat{GO}.",c:[{t:"«Sì, er solito»",e:{a:4,c:2},r:"Ti fa un taglio che non hai mai avuto. Ti sta benissimo. Da oggi è er solito."},{t:"Gli spieghi cosa vuoi",e:{fa:2},r:"Ti ascolta per 2 minuti, poi fa quello che vuole lui. Viene bene. A Roma funziona così."},{t:"Parlate di calcio per tutto il taglio",e:{f:3,T:{maranza:3}},r:"Il taglio dura 40 minuti, la discussione 50. Esci con i capelli corti e le idee chiare sulla difesa."}]}],kebab:[{w:[2,3],q:"Al kebab di notte c'è la gara: supplì, trapizzino o kebab? Tre amici, tre fazioni, nessun compromesso.",c:[{t:"Supplì, la tradizione",need:3,e:{s:-3,fa:3,b:6},r:"Il filo di mozzarella del supplì al telefono è lungo un metro. Per questo si chiama «al telefono»."},{t:"Trapizzino, il compromesso moderno",need:5,e:{s:-5,a:4,T:{insta:3}},r:"Pizza bianca ripiena di coda alla vaccinara. Hai unito tradizione e street food. Genio."},{t:"Kebab, l'internazionale",need:6,e:{s:-6,b:10},r:"Gli altri ti guardano come un traditore. Poi ti chiedono un morso. Tutti e due."}]}],bosco:[{w:[0,1],m:[4,5,6,7,8,9],q:"Gita al {LAKE}: acqua pulita, barche a vela e un signore che fa il bagno a maggio «perché so' romano, er freddo nun esiste».",c:[{t:"Fai il bagno anche tu",e:{T:{gym:5},b:-8,a:4},r:"L'acqua è gelida. Il signore ride: «Visto? Er freddo nun esiste.» Per lui."},{t:"Noleggi la canoa",need:10,e:{s:-10,T:{gym:6},f:4},r:"Remi per un'ora. Ti godi il lago in silenzio. Per un'ora Roma sembra lontana anni luce."},{t:"Picnic sul prato",need:5,e:{s:-5,fa:3,b:8},r:"Panini, frutta, una coperta. Domenica perfetta."}]}],giostre:[{w:[1,2],q:"Al luna park dell'EUR c'è la ruota panoramica storica. Dalla cima si vede tutta {METRO} e, dicono, «er cupolone».",c:[{t:"Sali sulla ruota al tramonto",need:5,e:{s:-5,f:6,a:4},r:"Roma color arancione, i pini, le cupole. Ti viene da dire «aò, che bella». Lo dici."},{t:"Autoscontri con gli amici",need:3,e:{s:-3,f:4,T:{maranza:5}},r:"Guida romana anche lì: nessuno rispetta le corsie. Divertimento puro."},{t:"Zucchero filato e chiacchiere",need:2,e:{s:-2,fa:2,b:4},r:"Il luna park di sera ha un'atmosfera da film. Tu sei la comparsa felice."}]}],sport:[{w:[1,2],q:"Calcetto a 5 sul campo in sintetico: uno degli avversari commenta ogni azione in romanesco stretto, come un telecronista.",c:[{t:"Rispondi a tono in campo",e:{T:{maranza:4,gym:4},f:3},r:"«E mo' vedi che te faccio.» Finisce 6-6 e tutti a prendere la pizza insieme."},{t:"Segni e non dici niente",ok:()=>S.T.gym>=25||Math.random()<.4,e:{a:8,T:{gym:6}},r:"Il silenzio dopo il gol vale più di mille parole. L'avversario applaude.",ef:{c:3},rf:"Sbagli a porta vuota. Il telecronista avversario non te lo farà dimenticare mai."},{t:"Fai il portiere e ridi",e:{fa:2,b:-6},r:"Prendi 9 gol, ma la telecronaca dell'avversario è così bella che ridete tutti fino a fine partita."}]}]},campania:{barbiere:[{w:[0,1,2],q:"Dal barbiere napoletano c'è la fila, il caffè offerto e una discussione accesa sul miglior cantante neomelodico.",c:[{t:"Partecipi al dibattito",e:{f:3,fa:2},r:"Dopo mezz'ora state cantando tutti in coro. Il taglio passa in secondo piano."},{t:"Ti fai fare il «taglio del calciatore»",need:15,e:{s:-15,f:6,T:{maranza:6}},r:"Sfumatura perfetta, riga laterale, sopracciglia sistemate. Il barbiere ti fa la foto per la vetrina."},{t:"Bevi il caffè e ascolti",e:{b:6,a:2},r:"Il caffè del barbiere è il migliore del quartiere. Lo dicono tutti. Hanno ragione."}]}],kebab:[{w:[2,3],q:"Dopo la discoteca: kebab o cuoppo fritto? Il ragazzo del cuoppo urla: «Uè, frà, qua se magna bbuono!»",c:[{t:"Cuoppo fritto con le zeppoline",need:5,e:{s:-5,b:10,fa:2},r:"Cono di carta, fritto bollente, il mare di notte. L'after perfetto."},{t:"Kebab, come sempre",need:6,e:{s:-6,b:10},r:"Il kebabbaro ti saluta per nome. La fedeltà ha i suoi vantaggi: salsa extra."},{t:"Pizza a portafoglio",need:2,e:{s:-2,b:8,a:3},r:"Due euro, una pizza piegata in quattro, il gusto della città. Imbattibile."}]}],sport:[{w:[0,1,2],q:"Calcetto sul campo di periferia: arriva un signore di 60 anni che giura di aver giocato con un campione degli anni '80. Gioca ancora benissimo.",c:[{t:"Gioci in squadra con lui",e:{T:{gym:5},f:3,a:3},r:"Ti fa tre assist perfetti. Alla fine ti dice: «Tieni il piede buono.» Il complimento più bello della tua vita."},{t:"Ti fai raccontare gli anni '80",e:{fa:4,a:2},r:"Un'ora di aneddoti. Non sai quanti siano veri. Non importa."},{t:"Fai il video dei suoi dribbling",e:{f:9,T:{insta:6}},r:"«Il nonno che dribbla tutti.» 300.000 views. Ora lo fermano per strada."}]}],bosco:[{w:[0,1],m:[4,5,6,7,8,9,10],q:"Gita sul Vesuvio: sentiero fino al cratere, vento forte e un turista che chiede se «adesso erutta».",c:[{t:"Arrivi fino al cratere",need:10,e:{s:-10,T:{gym:7},b:-10,a:4},r:"Il cratere è enorme, il golfo sotto è uno spettacolo. Ti senti in cima al mondo."},{t:"Rispondi al turista «Solo il martedì»",e:{f:4,c:2},r:"Il turista controlla il calendario. È martedì. Panico. Ridete tutti."},{t:"Foto panoramica del golfo",e:{f:8,T:{insta:6}},r:"Il golfo, le isole, il mare. La foto più bella del tuo profilo, senza filtri."}]}],stazione:[{w:[3],q:"Notte: l'ultima Circumvesuviana è stata soppressa. In stazione siete in 20 e un signore organizza i passaggi in macchina come un vigile.",c:[{t:"Accetti il passaggio organizzato",e:{fa:3,b:4},r:"Cinque persone in una Panda, la radio a palla. Arrivi a casa con 4 nuovi amici."},{t:"Chiami tuo cugino",e:{fa:4},r:"Arriva in 10 minuti, in pigiama. Non dice niente. Il cugino napoletano è un'istituzione."},{t:"Video «la stazione di notte»",e:{f:6,T:{insta:4}},r:"Il signore dei passaggi diventa il personaggio della settimana. Lo chiamano «il sindaco della stazione»."}]}]},calabria:{barbiere:[{w:[0,1,2],q:"Il barbiere del paese conosce tutti: mentre ti taglia i capelli ti racconta la storia di tre generazioni della tua famiglia.",c:[{t:"Ascolti e scopri segreti di famiglia",e:{fa:6,a:2},r:"Scopri che tuo nonno ha vinto una gara di ballo nel 1968. Nessuno te l'aveva mai detto."},{t:"Gli chiedi un taglio moderno",need:10,e:{s:-10,f:5,T:{maranza:5}},r:"Ci prova. Viene bene. Ti dice: «Così ti vede pure la nonna.» Alla nonna non piace."},{t:"Gli chiedi di non dire niente a nessuno",e:{c:3},r:"«Certo, certo.» Dopo un'ora tutto il paese sa del tuo taglio."}]}],kebab:[{w:[2,3],q:"Il kebabbaro del paese ha aggiunto la 'nduja al menù. «Kebab calabrese: si piange, ma si piange felici.»",c:[{t:"Lo provi",need:7,e:{s:-7,b:8,c:2},r:"Piangi. Sudi. Ne ordini un altro. Il kebabbaro ti dà il tè freddo gratis per pietà."},{t:"Lo prendi senza 'nduja",need:6,e:{s:-6,b:8},r:"Il kebabbaro ti guarda deluso: «Nel cuore no sei calabrese.» Il cuore sì, la lingua no."},{t:"Video «Kebab calabrese: reazione»",e:{f:9,T:{insta:6}},r:"La tua faccia diventa rossa come il peperoncino. Il kebabbaro mette il video in vetrina."}]}],bosco:[{w:[0,1],m:[8,9,10,11],q:"Bosco della Sila, autunno: castagne, funghi e un signore che ti offre un fico d'India sbucciato con le mani nude.",c:[{t:"Raccogli castagne con la famiglia",e:{fa:10,b:-6},r:"Un sacco pieno. La sera caldarroste nel camino. Tradizione rispettata."},{t:"Accetti il fico d'India",e:{a:3,c:2},r:"È dolcissimo. Il signore ti mostra le mani: nessuna spina. È un mago."},{t:"Foto dei colori del bosco",e:{f:7,T:{insta:5}},r:"Rosso, arancione, oro. Sembra il Canada. È la Calabria."}]}],giostre:[{w:[1,2],m:[6,7,8],q:"Luna park sul lungomare d'estate: musica, luci e un giostraio che fa salire tutti sul tagadà urlando «Chi è calabrese non cade!».",c:[{t:"Sali e provi a non cadere",need:3,e:{s:-3,T:{gym:4},f:4},r:"Cadi dopo 30 secondi. Ma ti rialzi e il giostraio ti applaude: «Calabrese DOC!»"},{t:"Granita al limone e passeggiata",need:2,e:{s:-2,b:6,fa:2},r:"Granita, mare, luci. La serata estiva perfetta."},{t:"Video del giostraio",e:{f:8,T:{insta:5}},r:"Il giostraio diventa virale. Ora fa i video per tutto il sud."}]}],sport:[{w:[0,1,2],q:"Torneo di calcetto tra paesi: la squadra del tuo paese ha bisogno di un giocatore. Il premio è un prosciutto intero.",c:[{t:"Giochi per il paese",e:{T:{gym:6},fa:4,a:3},r:"Vincete in finale ai rigori. Il prosciutto viene diviso in 12. Ognuno lo porta a casa come un trofeo."},{t:"Fai il tifo con la nonna",e:{fa:8},r:"La nonna urla più di tutti. L'arbitro ha paura di lei."},{t:"Fai il video della premiazione",e:{f:8,T:{insta:5}},r:"Il capitano che alza il prosciutto come una coppa. Il video gira tutta la regione."}]}],stazione:[{w:[3],q:"Notte: alla stazione non passa più niente fino alle 6. Ci sei tu e un ragazzo che torna dal Nord con una valigia piena di regali.",c:[{t:"Gli fai compagnia fino al mattino",e:{fa:3,a:4,b:-8},r:"Ti racconta del lavoro al Nord, della nebbia, della nostalgia. Alle 6 vi abbracciate. Amici."},{t:"Chiami un amico per un passaggio",e:{fa:3,b:4},r:"Arriva in 15 minuti. Accompagnate anche il ragazzo. La sua mamma vi offre la colazione."},{t:"Dormi sulla panchina con lo zaino come cuscino",e:{b:-6,c:3},r:"Ti svegli alle 6 con il collo storto e un gatto sopra le gambe. Avventura."}]}]},sicilia:{barbiere:[{w:[0,1,2],q:"Il barbiere siciliano canta mentre ti taglia: un'opera intera. Il cliente dopo di te applaude alla fine.",c:[{t:"Applaudi anche tu",e:{fa:2,a:3},r:"Si inchina con le forbici in mano. Il taglio è perfetto, il concerto pure."},{t:"Gli chiedi un pezzo moderno",e:{f:4,c:2},r:"Canta una canzone pop in versione lirica. Tutto il negozio canta. Momento magico."},{t:"Video «il barbiere tenore»",e:{f:9,T:{insta:6}},r:"200.000 views. Ora ha la fila dei turisti fuori dal negozio."}]}],kebab:[{w:[2,3],q:"Il kebabbaro ha messo il «kebab all'arancina»: un'arancina dentro il kebab. Una sfida all'umanità.",c:[{t:"Lo provi",need:8,e:{s:-8,b:14,c:3},r:"Il kebab più pesante della storia. Lo finisci. Dormi per 12 ore. Ne valeva la pena."},{t:"Gli chiedi di non farlo più",e:{a:4},r:"«È una tradizione nuova!» Dice che continuerà. La Sicilia è terra di sperimentazione."},{t:"Video «l'invenzione più siciliana»",e:{f:9,T:{insta:7}},r:"Il dibattito è ovunque. Il kebabbaro diventa famoso. Ora fa anche il kebab al cannolo."}]}],bosco:[{w:[0,1],m:[4,5,6,9,10],q:"Gita sull'Etna: sentieri di lava nera, crateri spenti e un vento che sa di zolfo. La guida dice: «Qui la terra è viva.»",c:[{t:"Arrivi ai crateri silvestri",need:8,e:{s:-8,T:{gym:6},a:5,b:-8},r:"Ti siedi sul bordo di un cratere. Sotto di te la Sicilia, il mare, il cielo. Momento da ricordare."},{t:"Raccogli una pietra lavica",e:{a:3,fa:2},r:"La guida ti ricorda che si porta via solo una foto. La rimetti a posto. Rispetto per la montagna."},{t:"Foto «sulla Luna»",e:{f:8,T:{insta:6}},r:"Paesaggio nero, cielo azzurro. Sembra un altro pianeta. Commenti: «Sei sulla Luna?»"}]}],giostre:[{w:[1,2],q:"Al luna park c'è il «Cannolo Gigante»: una giostra a forma di cannolo che gira. Nessuno sa chi l'abbia inventata.",c:[{t:"Sali sul Cannolo",need:3,e:{s:-3,f:5,c:2},r:"Gira, sale, scende. Esci con la testa che gira e la voglia di un cannolo vero."},{t:"Compri un cannolo vero",need:3,e:{s:-3,b:8,fa:2},r:"Ricotta fresca, cialda croccante. Molto meglio della giostra."},{t:"Video della giostra assurda",e:{f:8,T:{insta:6}},r:"«In Sicilia anche le giostre sono dolci.» Lo condividono tutti."}]}],sport:[{w:[0,1],m:[5,6,7,8,9,10],q:"Gita in barca alle Egadi: acqua trasparente, una grotta da esplorare a nuoto e il capitano che cucina la pasta a bordo.",c:[{t:"Nuoti fino alla grotta",need:20,e:{s:-20,T:{gym:7},a:4,b:-8},r:"Dentro la grotta l'acqua è azzurra come un neon. Ti viene la pelle d'oca."},{t:"Mangi la pasta del capitano",need:20,e:{s:-20,b:12,fa:3},r:"Pasta con i ricci di mare, sul mare, al sole. Il pranzo più bello dell'estate."},{t:"Foto in barca con il mare turchese",need:20,e:{s:-20,f:9,T:{insta:7}},r:"Nessun filtro. Nei commenti: «Maldive?» No, Sicilia."}]}],stazione:[{w:[3],q:"Notte di estate in stazione: fa ancora 30 gradi. Un ragazzo vende granite da un carrellino «solo per chi aspetta il treno».",c:[{t:"Prendi una granita al limone",need:2,e:{s:-2,b:8},r:"Fresca, acida, perfetta. Il treno arriva in ritardo, ma tu sei felice."},{t:"Chiedi al ragazzo come è nato il business",e:{a:3,T:{crypto:4}},r:"«Ho visto che la gente aspettava e aveva caldo.» Imprenditoria pura."},{t:"Fai il video «la granita notturna»",e:{f:7,T:{insta:5}},r:"Il ragazzo del carrellino diventa famoso. Ora ha due carrellini."}]}],casa:[{w:[1],q:"La nonna fa la conserva di pomodoro secco: centinaia di pomodori al sole sulla terrazza. «Guai a chi li tocca.»",c:[{t:"La aiuti a girarli",e:{fa:10,b:-4},r:"Due ore al sole. La nonna ti dà il primo barattolo. È oro rosso."},{t:"Ne assaggi uno di nascosto",e:{fa:-3,b:4},r:"La nonna li conta. Lo sa. «Chi è stato?» Non risponde nessuno. Ma lo sa."},{t:"Video «la terrazza della nonna»",e:{f:8,T:{insta:5}},r:"Centinaia di pomodori rossi sotto il cielo blu. La nonna diventa famosa. Non le interessa."}]}]},sardegna:{barbiere:[{w:[0,1,2],q:"Il barbiere del paese parla poco: «Corto?» «Sì.» «Va bene.» Fine della conversazione. Taglio perfetto in 12 minuti.",c:[{t:"Apprezzi l'efficienza",e:{a:4,T:{aura:3}},r:"Il miglior taglio della tua vita, con quattro parole in tutto. Rispetto."},{t:"Provi a fare conversazione",e:{c:2,fa:1},r:"Risponde con un «ajò» a ogni domanda. Hai imparato che «ajò» va bene per tutto."},{t:"Lasci la mancia",need:2,e:{s:-2,a:2},r:"Ti guarda, annuisce, mette i soldi in tasca. Tra voi c'è un'intesa."}]}],kebab:[{w:[2,3],q:"Il kebabbaro sardo ha creato il «kebab con il pane carasau»: croccante, impossibile da mangiare senza sbriciolare tutto.",c:[{t:"Lo provi",need:7,e:{s:-7,b:8,c:2},r:"Le briciole arrivano ovunque, anche nelle scarpe. È buonissimo. Ti serve una doccia."},{t:"Kebab classico",need:6,e:{s:-6,b:8},r:"Il kebabbaro ti guarda deluso. «Non hai spirito sperimentale.» Hai i pantaloni puliti."},{t:"Video «la sfida del carasau»",e:{f:9,T:{insta:6}},r:"Chi mangia senza sbriciolare vince. Nessuno vince. Il video è perfetto."}]}],bosco:[{w:[0,1],q:"Gita al Supramonte: canyon, pareti di roccia e un pastore che ti offre il formaggio dalla bisaccia.",c:[{t:"Fai il sentiero nel canyon",e:{T:{gym:8},b:-12,a:4},r:"Pareti altissime, silenzio, un'aquila. Ti senti piccolissim{GO} e felice."},{t:"Assaggi il formaggio del pastore",e:{fa:3,b:6},r:"Pecorino stagionato, saporito. Il pastore ti racconta della transumanza. Mezz'ora che vale un anno."},{t:"Foto del canyon",e:{f:8,T:{insta:6}},r:"Sembra il Grand Canyon. È la Sardegna. I commenti non ci credono."}]}],giostre:[{w:[1,2],m:[6,7,8,9],q:"Festa del paese con le giostre: c'è anche la gara di ballo sardo in piazza. Le nonne fanno il ballo tondo perfetto.",c:[{t:"Entri nel ballo tondo",e:{fa:8,a:4,b:-6},r:"Ti prendono per mano e ti insegnano i passi. Al terzo giro sei dentro. Che bellezza."},{t:"Autoscontri con gli amici",need:3,e:{s:-3,f:4,T:{maranza:4}},r:"Scontri, risate, una macchinina che si ferma sempre. La serata perfetta."},{t:"Video del ballo delle nonne",e:{f:8,T:{insta:5}},r:"Il cerchio che gira, i costumi, la musica. Il video più bello della festa."}]}],disco:[{w:[3],m:[6,7,8],q:"Estate in discoteca sulla costa: l'ingresso costa come un volo per Milano. Il PR dice: «Stasera ci sono i vip del continente.»",c:[{t:"Entri per vedere i vip",need:40,e:{s:-40,f:8,T:{insta:6}},r:"I vip sono due tronisti e un calciatore di Serie C. La musica però è ottima."},{t:"Spiaggia libera con gli amici e la chitarra",e:{fa:3,a:5},r:"Falò, stelle, il mare scuro. La serata più bella dell'estate, gratis."},{t:"Video «i prezzi della costa»",e:{f:9,T:{insta:6}},r:"Lo scontrino della bottiglietta d'acqua a 10 € diventa virale. «Sardegna: l'acqua del mare è gratis.»"}]}],sport:[{w:[0,1,2],q:"Torneo di beach volley al Poetto: squadre miste, sabbia bollente e un arbitro con il fischietto e le infradito.",c:[{t:"Giochi in squadra",e:{T:{gym:7},f:4,b:-10},r:"Arrivate in semifinale. Ti bruci i piedi, ma ti tuffi come in TV."},{t:"Fai il tifo dalla spiaggia",e:{fa:2,b:4},r:"Ombrellone, acqua, applausi. Il ruolo di tifoso ti riesce benissimo."},{t:"Video delle schiacciate",e:{f:8,T:{insta:5}},r:"Slow motion, sabbia che vola, il mare dietro. Sembra una pubblicità."}]}],stazione:[{w:[3],q:"Notte in stazione: l'ultimo treno è andato. Un signore anziano che aspetta come te ti offre un pezzo di pane e salsiccia.",c:[{t:"Accetti e chiacchierate",e:{fa:3,a:4},r:"Ti racconta di quando faceva il pastore. Alle 2 arriva suo figlio a prenderlo e accompagnano anche te."},{t:"Chiami un taxi",need:15,e:{s:-15,b:6},r:"Il taxi arriva dopo 40 minuti. Il signore ti saluta con la mano. Vi rivedrete al mercato."},{t:"Gli offri le tue cuffie per sentire musica",e:{fa:2,f:2},r:"Sente una canzone pop. Ride. Poi ti fa sentire un canto a tenores dal suo telefono. Scambio culturale."}]}],casa:[{w:[1],q:"La tzia ti insegna a fare le seadas: formaggio fresco, pasta sottile, frittura e miele amaro. «Piano, piano, che si rompono.»",c:[{t:"Le fai con pazienza",e:{fa:10,b:-4},r:"Le prime tre si rompono. La quarta è perfetta. La tzia ti dà un bacio in fronte."},{t:"Le mangi appena fritte",e:{b:10,fa:2},r:"Calde, croccanti, miele che cola. Ti bruci la lingua. Non te ne importa."},{t:"Video della ricetta",e:{f:8,T:{insta:5}},r:"La tzia spiega in sardo, tu metti i sottotitoli. 100.000 views. La tzia è una star."}]}]}},EVRREG5={lombardia:[{q:"Notifica dal gruppo dei colleghi del lavoretto: «Riunione di allineamento domani alle 8:30 per allineare l'allineamento.»",c:[{t:"Rispondi «Perfetto, ci sono»",e:{a:2,T:{crypto:3}},r:"La riunione dura 50 minuti. La decisione finale: fare un'altra riunione. Business lombardo."},{t:"Chiedi l'ordine del giorno",e:{a:4},r:"Nessuno risponde. L'ordine del giorno è la riunione stessa."},{t:"Silenzi il gruppo",free:!0,e:{b:3},r:"La mattina dopo scopri che la riunione è stata spostata. Hai vinto."}]},{m:[10,11,12,1,2],q:"Allerta nebbia: visibilità 20 metri. Tua madre ti scrive: «Non uscire con il motorino, che non ti vedono.»",c:[{t:"Resti a casa",e:{fa:5,b:8},r:"Pomeriggio sul divano con la coperta. La nebbia fuori è quasi romantica."},{t:"Esci con la giacca catarifrangente",e:{c:3,fa:3},r:"Sembri un omino della segnaletica. Ma ti vedono da un chilometro. Tua madre è fiera."},{t:"Foto «la nebbia di casa»",e:{f:6,T:{insta:5}},r:"Lampioni come lune, alberi fantasma. Nei commenti del Sud: «Ma come fate?»"}]}],campania:[{q:"Il gruppo di famiglia esplode: la zia ha visto un video in cui dicono che la pizza vera si fa a Milano. 140 messaggi in 10 minuti.",c:[{t:"Mandi il video della pizzeria sotto casa",e:{fa:6,f:2},r:"Pace istantanea. La zia scrive: «Ecco, questa è pizza.» Il gruppo torna tranquillo."},{t:"Scrivi «Ma è solo una pizza»",e:{fa:-6,c:3},r:"Silenzio. Poi 40 vocali. Hai commesso un errore storico."},{t:"Silenzi il gruppo",free:!0,e:{b:4},r:"Tornando trovi una votazione: «La pizza vera è a {METRO}». 100% di sì. Ovviamente."}]},{m:[6,7,8],q:"Domenica al mare: la famiglia parte alle 7 con ombrellone, sedie, tavolino, parmigiana, frittata di maccheroni e anguria. Sembra un trasloco.",c:[{t:"Aiuti a portare tutto",e:{fa:10,b:-8},r:"Tre viaggi dal parcheggio. Alle 13 la frittata di maccheroni ti ripaga di ogni fatica."},{t:"Video «il trasloco al mare»",e:{f:9,T:{insta:6}},r:"Tuo padre che porta l'anguria come un trofeo. 150.000 views. Ora lo riconoscono in spiaggia."},{t:"Arrivi più tardi in motorino",e:{fa:-3,b:6},r:"Arrivi quando è tutto montato. Tua madre: «Ah, ecco il principe.» Ma ti dà la frittata lo stesso."}]}],calabria:[{q:"La zia dal Nord manda un messaggio: «Domani arrivo, preparate il letto e la 'nduja.» Ha 70 anni e viaggia con 3 valigie.",c:[{t:"Vai a prenderla alla stazione",e:{fa:10,b:-6},r:"Le valigie pesano come mattoni: dentro ci sono regali per tutto il paese. La zia ti abbraccia per 5 minuti."},{t:"Le prepari la cameretta con i fiori",e:{fa:8,a:2},r:"La zia si commuove. Ti dà 20 € «per il gelato». Hai 19 anni. Li prendi lo stesso.",do:()=>{S.st.s+=20}},{t:"Ti nascondi dalla zia",e:{fa:-4,b:4},r:"Ti trova dopo 10 minuti. «Ma come sei cresciut{GO}!» Ti stringe le guance davanti a tutti."}]}]};for(const a in EVREG5)for(const i in EVREG5[a])for(const e of EVREG5[a][i])e.reg=a,(EV[i]=EV[i]||[]).push(e);for(const a in EVRREG5)for(const i of EVRREG5[a])i.reg=a,EVR.push(i);const EVMORE2={sp_pet:[{m:[11,12,1,2,3],q:"Fa freddo: il pet party si sposta al chiuso, in una palestra comunale. Cani con il cappottino, gatti nei trasportini riscaldati, un furetto con la sciarpa.",c:[{t:"Fai il giro di tutti i cappottini",e:{T:{pet:6},f:4},r:"Un bassotto ha un piumino più bello del tuo. Ti segni il negozio."},{t:"Video «la sfilata dei cappottini»",e:{f:8,T:{insta:5,pet:3}},r:"Il furetto con la sciarpa diventa una star. Il padrone apre un profilo per lui."},{t:"Aiuti a sistemare le ciotole d'acqua",e:{T:{pet:5},fa:2},r:"Gli organizzatori ti nominano «assistente ufficiale». Hai un badge di cartone. Ne vai fier{GO}."}]},{m:[12],q:"Pet party di Natale: foto con Babbo Natale per gli animali. Un gatto ha graffiato la barba finta. Babbo Natale resiste.",c:[{t:"Fai la foto con il tuo animale",ok:()=>!!S.pet,need:5,e:{s:-5,f:6,T:{pet:6}},r:"Nella foto il tuo animale guarda dall'altra parte. Babbo Natale sorride stoicamente. Cartolina perfetta.",ef:{c:2},rf:"Non hai un animale. Fai la foto tu sulle ginocchia di Babbo Natale. Il fotografo ride."},{t:"Porti un regalo per il canile",need:8,e:{s:-8,T:{pet:7},a:3},r:"Un sacco di crocchette con il fiocco. I volontari ti abbracciano. Natale vero."},{t:"Fai il video di Babbo Natale contro il gatto",e:{f:9,c:2},r:"Round 1: gatto. Round 2: gatto. Round 3: gatto. Babbo Natale si arrende."}]},{m:[11,12,1,2,3],q:"Al pet party al chiuso c'è uno sportello del veterinario: controlli gratis e consigli su come scaldare la cuccia in inverno.",c:[{t:"Porti il tuo animale al controllo",ok:()=>!!S.pet,e:{T:{pet:7},fa:2},do:()=>{S.pet&&(S.pet.hap=Math.min(100,(S.pet.hap||70)+10))},r:"Tutto a posto. Il veterinario ti dà un biscotto da dargli. Il tuo animale è felicissimo.",ef:{a:2},rf:"Non hai un animale. Fai domande per quando lo avrai. Il veterinario apprezza la serietà."},{t:"Chiedi consigli sulle cucce",e:{T:{pet:5},a:2},r:"Coperta di lana, lontano dalle porte, mai vicino al termosifone. Annoti tutto."},{t:"Aiuti a tenere i gatti agitati",e:{T:{pet:4},b:-6},r:"Un gatto ti morde la manica e poi ti fa le fusa. Relazione complicata."}]},{m:[1,2,3],q:"Al pet party invernale fanno il «tè per umani e cani»: biscotti al burro di arachidi per i cani, cioccolata per i padroni.",c:[{t:"Prendi la cioccolata e chiacchieri",need:3,e:{s:-3,fa:2,b:6},r:"Chiacchiere con altri padroni, storie di cani che rubano calzini. Pomeriggio caldo e leggero."},{t:"Assaggi per sbaglio il biscotto dei cani",e:{c:4,f:4},r:"Non è male. Lo dici ad alta voce. Tutti si girano. Il momento più famoso della giornata."},{t:"Fai le foto di tutti i musi sporchi di biscotto",e:{f:8,T:{insta:4,pet:3}},r:"Il collage dei musi diventa il post più amato della festa."}]}],sp_insta:[{m:[11,12,1,2,3],q:"D'inverno il rooftop è chiuso: i creator si spostano in un bar «aesthetic» con le pareti rosa e il neon con scritto «good vibes only».",c:[{t:"Foto sotto il neon",need:5,e:{s:-5,f:7,T:{insta:7}},r:"La foto è identica a quella di altri 400 profili. Funziona lo stesso: 600 like."},{t:"Fai la foto al barista che ride del neon",e:{f:6,a:3},r:"La foto più sincera della giornata. Il barista la mette come foto profilo."},{t:"Prendi un caffè normale e osservi",need:2,e:{s:-2,a:4,T:{aura:3}},r:"Un'ora a guardare gente che fotografa il cappuccino. Antropologia moderna."}]},{m:[11,12,1,2,3],q:"Workshop al chiuso: «Come fare 10 contenuti in un'ora con il telefono». La relatrice ha 2 milioni di follower e la voce senza fiato.",c:[{t:"Segui e prendi appunti",need:10,e:{s:-10,T:{insta:8},f:4},r:"Impari il trucco della luce dalla finestra. I tuoi contenuti migliorano davvero."},{t:"Fai domande sul suo primo anno di profilo",e:{a:4,f:3},r:"«Avevo 40 follower per un anno.» Ti dà speranza e un po' di paura."},{t:"Te ne vai a metà",e:{b:6},r:"Fuori nevica. Fai il contenuto più bello della giornata da solo: un fiocco di neve sul guanto."}]}],parchetto:[{q:"Al parchetto qualcuno ha montato una slackline tra due alberi. Ci camminano sopra tutti, e cadono tutti.",c:[{t:"Provi a camminare sulla slackline",e:{T:{gym:5},b:-6,f:3},r:"Due passi, poi cadi sull'erba. Al decimo tentativo fai tutto il percorso. Applausi del parchetto."},{t:"Fai il video delle cadute",e:{f:8,T:{insta:5}},r:"Compilation di 20 cadute in 30 secondi. Il ragazzo della slackline la condivide orgoglioso."},{t:"Ti siedi a guardare",e:{b:4},r:"Lo spettacolo migliore del pomeriggio è gratis."}]},{q:"Al parchetto due bambini ti chiedono di fare l'arbitro della loro partita di calcio. Le porte sono due giacche.",c:[{t:"Fai l'arbitro serio, con fischio",e:{fa:3,a:3},r:"Ammonisci un bambino di 8 anni per simulazione. Lui accetta con dignità. Grande momento sportivo."},{t:"Giochi con loro",e:{T:{gym:4},fa:3,b:-6},r:"Perdi 7-2 contro due bambini. Uno ti dice «sei forte comunque». Non ci credi, ma grazie."},{t:"Fai il telecronista",e:{f:4,fa:2},r:"«E con un tiro clamoroso… colpisce il cane!» I bambini ridono così tanto che si sdraiano per terra."}]},{q:"Al parchetto c'è un gruppo di signore che fa tai chi in silenzio. Movimenti lenti, respiro profondo, un cane che le guarda perplesso.",c:[{t:"Ti unisci al tai chi",e:{a:5,T:{aura:5},b:4},r:"Dieci minuti di movimenti lenti. Ti senti calm{GO} come mai prima. Le signore ti invitano per giovedì."},{t:"Fai il video «tai chi al parchetto»",e:{f:6,T:{insta:4}},r:"Il cane perplesso diventa il protagonista. Le signore ti chiedono di toglierlo. Il cane, non il video."},{t:"Passi in silenzio per non disturbare",e:{a:3},r:"Una signora ti fa un cenno di ringraziamento. Il rispetto è aura."}]},{q:"Al parchetto qualcuno ha lasciato una libreria di scambio: «Prendi un libro, lascia un libro.» Dentro ci sono 14 copie dello stesso giallo.",c:[{t:"Prendi il giallo e lasci un tuo libro",e:{a:4,T:{aura:3}},r:"Lo leggi in due giorni. Il colpevole è il giardiniere. Lo avevi capito a pagina 3."},{t:"Fai il video «14 copie dello stesso libro»",e:{f:7,c:2},r:"Il mistero diventa virale. Si scopre che l'autore abita nel palazzo di fronte."},{t:"Lasci un fumetto per i bambini",e:{fa:3,a:2},r:"Il giorno dopo il fumetto non c'è più. Al suo posto c'è un disegno di ringraziamento."}]},{w:[3],q:"Notte al parchetto: le panchine sono umide, c'è un gruppo che guarda le stelle con un'app. Uno è convinto di aver visto un satellite «segreto».",c:[{t:"Guardi le stelle con loro",e:{a:4,fa:2},r:"Con l'app trovi Orione e Giove. Il satellite segreto era un aereo. Serata lo stesso bellissima."},{t:"Teoria del complotto sul satellite",e:{f:4,c:4},r:"Alla fine siete in sei a fissare un punto luminoso. Era la luce di un palazzo."},{t:"Torni a casa a dormire",e:{b:12},r:"Il letto è meglio delle panchine umide. Le stelle le guardi dalla finestra."}]}],casa:[{w:[3],q:"Notte: non riesci a dormire. Il telefono ti propone un video di 3 ore di «suoni rilassanti di una lavatrice».",c:[{t:"Lo metti e ti addormenti al minuto 4",e:{b:20},r:"La lavatrice è il miglior sonnifero del mondo. Chi l'avrebbe detto."},{t:"Scrolli fino alle 3",e:{b:-12,c:2},r:"Alle 3 sai tutto sulla vita delle lontre. Domani sarà dura."},{t:"Leggi un libro con la luce del telefono",e:{a:4,b:6},r:"Dopo 10 pagine dormi con il libro sulla faccia. Il libro aveva ragione."}]},{w:[3],q:"Notte: senti un rumore in cucina. È tuo padre che mangia il dolce del giorno dopo direttamente dal frigo, al buio.",c:[{t:"Ti unisci in silenzio",e:{fa:8,b:4},r:"Mangiate in silenzio, al buio, illuminati dal frigo. Il patto è sacro: domani nessuno sa niente."},{t:"Accendi la luce",e:{fa:4,f:2},r:"Tuo padre si blocca con la forchetta in bocca. Poi ride. Anche tu. Momento d'oro."},{t:"Torni a letto fingendo di non aver visto",e:{a:3},r:"Domani mancherà mezza torta. Tua madre chiederà. Tu non sai niente."}]}],kebab:[{w:[2,3],q:"Al kebab entra una squadra di calcetto dopo la partita: 10 ragazzi sudati che ordinano 10 kebab con salse diverse, tutti insieme.",c:[{t:"Aiuti il kebabbaro con le ordinazioni",e:{fa:2,a:3,s:5},r:"Ti dà 5 € e un kebab gratis. Hai lavorato 10 minuti più di quanto lavori di solito in una settimana."},{t:"Ti metti in coda paziente",e:{b:-4,a:2},r:"Mezz'ora dopo è il tuo turno. Il kebabbaro ti ringrazia della pazienza con doppia cipolla."},{t:"Chiedi alla squadra com'è andata la partita",e:{f:3,fa:2},r:"Hanno perso 9-1. Te la raccontano come se avessero vinto la Champions."}]},{w:[2,3],q:"Il kebabbaro ti mostra la foto del suo primo giorno di lavoro, 20 anni fa: stesso grembiule, stessi baffi, stessa radio.",c:[{t:"Ti fai raccontare la sua storia",e:{fa:3,a:4},r:"Vent'anni di kebab, tre figli all'università, una passione per la pesca. Esci con un nuovo rispetto."},{t:"Gli proponi di fare un video «20 anni di kebab»",e:{f:8,T:{insta:5}},r:"Il video commuove il paese. Il giorno dopo c'è la fila di clienti nuovi."},{t:"Gli fai i complimenti per i baffi",e:{f:2,fa:2},r:"«Sono il segreto del successo.» Probabilmente è vero."}]}],disco:[{w:[2,3],q:"Serata «revival anni 2000» in discoteca: tutti con i jeans a vita bassa, i telefoni a conchiglia di cartone e la musica dei cartoni.",c:[{t:"Balli tutte le hit del 2005",need:10,e:{s:-10,f:5,fa:2},r:"Conosci tutte le parole senza sapere perché. La nostalgia di un'epoca in cui avevi 0 anni."},{t:"Ti travesti da «star del 2005»",e:{f:8,c:3,T:{insta:5}},r:"Visiera, cintura borchiata, occhiali colorati. Vinci il premio del costume. Tua madre riconosce i suoi vestiti."},{t:"Fai il video «i miei genitori a vent'anni»",e:{f:7,fa:3},r:"I tuoi genitori lo vedono, ridono, poi ammettono che bal ne appena sfornato ti porta a un forno aperto alle 4 del mattino. Il fornaio ti fa segno di entrare dal retro.",w:[3,0],c:[{t:"Entri e assaggi il primo pane del giorno",e:{b:12,fa:2},r:"Crosta calda, mollica fumante. Il fornaio non dice niente, sorride. Il miglior pane della tua vita."},{t:"Ti offri di aiutarlo a sfornare",e:{s:10,b:-6,fa:3},r:"Un'ora di teglie bollenti. Ti paga 10 € e un sacchetto di cornetti. Ritorni a casa all'alba, felice."},{t:"Gli chiedi il segreto del pane",e:{a:4},r:"«Il lievito di mia nonna. Ha 70 anni.» Il lievito, non la nonna. Forse entrambi."}]},{q:"Senza sapere come, finisci sul tetto di un palazzo con altre sei persone. Nessuno si conosce. Tutti guardano il tramonto in silenzio.",w:[2],c:[{t:"Resti in silenzio con loro",e:{a:8,T:{aura:6}},r:"Il sole tramonta. Qualcuno applaude piano. Poi tutti scendono senza dirsi niente. Una cosa che non saprai spiegare a nessuno."},{t:"Fai una foto di gruppo",e:{f:6,fa:1},r:"Sette sconosciuti, un tramonto. Nei commenti chiedono «chi sono?». Non lo sai neanche tu."},{t:"Chiedi chi ha organizzato",e:{c:2,a:2},r:"Si guardano tutti. Nessuno. Brividi."}]},{q:"Un aquilone rosso cade ai tuoi piedi. Il filo è lungo, lunghissimo, e porta oltre i tetti.",c:[{t:"Segui il filo",e:{b:-8,a:5,fa:2},r:"Dopo mezz'ora trovi un bambino in lacrime su una collina. Gli riporti l'aquilone. Ti guarda come un supereroe."},{t:"Lo fai volare tu",e:{T:{gym:3},f:3},r:"Corri, salta, vola. Per dieci minuti hai di nuovo 8 anni."},{t:"Lo appendi a un ramo, ben visibile",e:{a:3},r:"Il giorno dopo non c'è più. Al suo posto c'è un bigliettino: «Grazie.»"}]},{q:"Il vento ti fa volare via un foglio dalla tasca. Lo rincorri fino a una panchina dove una signora lo sta già leggendo. Era la tua lista della spesa.",c:[{t:"Ti presenti e ridete insieme",e:{fa:2,a:3},r:"«Hai dimenticato il latte», ti dice. Era vero. Ti offre una caramella alla menta."},{t:"Le chiedi di aggiungere qualcosa alla lista",e:{f:2,c:2},r:"Scrive «un po' di coraggio». Lo compri sempre, da oggi."},{t:"Lo riprendi con dignità",e:{a:2},r:"Lei te lo porge come un diploma. Esci a testa alta, senza il latte."}]},{q:"Segui un odore di zucchero bruciato e trovi una bancarella che non c'era mai stata: «Dolci di un altro tempo». Il venditore ha un cappello a cilindro.",c:[{t:"Compri il dolce più strano",need:3,e:{s:-3,b:10,a:3},r:"Sa di mela, cannella e di un'estate che non hai mai vissuto. Strano. Bellissimo."},{t:"Chiedi da dove viene",e:{a:4,c:2},r:"«Da dietro l'angolo», dice. Ti giri: dietro l'angolo c'è solo un muro."},{t:"Fai una storia sulla bancarella",e:{f:6,T:{insta:4}},r:"La storia viene vista da 300 persone. Il giorno dopo la bancarella non c'è più. Nessuno la ritrova."}]},{q:"Ti ritrovi davanti alla tua vecchia scuola elementare. Il cancello è aperto e la bidella è la stessa di 10 anni fa.",w:[1,2],c:[{t:"Entri a salutarla",e:{fa:6,a:3},r:"Si ricorda il tuo nome e la volta che hai mangiato la colla. Vi abbracciate. Ti manca un po' tutto."},{t:"Guardi da fuori il cortile",e:{a:4},r:"Lo scivolo sembra piccolissimo. Ti ricordi di quando era un grattacielo."},{t:"Fai il video «torno alle elementari»",e:{f:8,T:{insta:5}},r:"La bidella saluta in camera: «Ciao, bimbo!» Commenti commossi."}]},{q:"Un cane senza collare ti guarda, abbaia una volta e inizia a camminare. Si ferma e si gira: vuole che lo segui.",c:[{t:"Lo segui",e:{T:{pet:6},b:-6},r:"Ti porta fino a una signora che lo stava cercando da ore. «Vagabondo, chi hai portato?» Ti offre un caffè."},{t:"Gli dai un pezzo di panino",e:{T:{pet:4},fa:1},r:"Lo mangia, ti lecca la mano e se ne va soddisfatto. Missione compiuta, almeno per lui."},{t:"Chiami il canile per sicurezza",e:{T:{pet:3},a:3},r:"Ha il microchip. Torna a casa in un'ora. Ti mandano la foto del cane sul divano."}]},{q:"In un parcheggio vuoto qualcuno ha disegnato col gesso un'enorme campana. In fondo c'è scritto: «Solo per chi passa di qui per caso».",c:[{t:"Ci giochi",e:{fa:2,T:{gym:2},a:3},r:"Salti fino al cielo senza toccare le righe. Una signora dal balcone applaude."},{t:"Aggiungi una casella con un disegno tuo",e:{f:2,a:4},r:"Disegni un cuore. Il giorno dopo qualcuno ne ha aggiunta un'altra. La campana cresce."},{t:"Fai la foto e vai",e:{f:3},r:"La campana resta lì, ad aspettare il prossimo."}]},{q:"Il vento ti porta alla fermata di un autobus che non hai mai preso. Arriva subito. Sul display c'è scritto solo: «Giro panoramico».",c:[{t:"Sali",need:2,e:{s:-2,a:5,b:4},r:"Un'ora di giro tra colline, cascine e paesi sconosciuti. Torni al punto di partenza con un'idea nuova in testa."},{t:"Chiedi all'autista dove va",e:{c:2,a:2},r:"«Dove deve.» Chiude le porte e parte. Non saprai mai dove."},{t:"Ti siedi alla fermata a guardare",e:{b:6},r:"L'autobus parte vuoto. Ti senti come in un film francese."}]},{q:"Trovi una cabina telefonica dimenticata. Il telefono squilla appena ti avvicini.",c:[{t:"Rispondi",e:{a:6,c:3},r:"Una voce dice: «Finalmente! Il pacco è pronto, lo ritiri tu?» Poi riattacca. Nessun pacco. Nessuna spiegazione."},{t:"Fai il video mentre squilla",e:{f:9,T:{insta:5}},r:"Il video diventa virale come «il telefono che chiama solo te». Tre youtuber vengono a cercarlo."},{t:"Ti allontani di corsa",e:{b:-4,c:2},r:"Dopo dieci metri smette di squillare. Non ti giri."}]},{q:"Seguendo la musica arrivi a una festa di matrimonio in un cortile. Ti scambiano per un cugino lontano. Ti mettono un piatto in mano.",w:[2,3],m:[5,6,7,8,9],c:[{t:"Stai al gioco e balli con la nonna della sposa",e:{fa:3,b:-6,f:4},r:"Balli il liscio, mangi la torta, firmi il libro degli invitati. La sposa ti ringrazia di essere venut{GO} «da così lontano»."},{t:"Spieghi l'equivoco",e:{a:4},r:"Ridono tutti. Ti fanno restare lo stesso: «A un matrimonio un posto in più c'è sempre.»"},{t:"Prendi un confetto e scappi",e:{c:3,b:4},r:"Ti inseguono due zie col sacchetto della bomboniera. Ti raggiungono. Ora hai una bomboniera."}]},{q:"In una via secondaria trovi una libreria piccolissima. Il libraio ti dà un libro senza chiederti niente: «Questo è tuo. Lo riporti quando l'hai finito.»",c:[{t:"Lo prendi e lo leggi davvero",e:{a:8,T:{aura:6},b:-4},r:"Lo finisci in due notti. Sembra scritto per te. Quando lo riporti, il libraio ne ha già pronto un altro."},{t:"Chiedi perché proprio quello",e:{a:4},r:"«Perché sei passat{GO} di qui.» Nessun'altra spiegazione."},{t:"Lo rifiuti con gentilezza",e:{a:1},r:"Il libraio annuisce. «Tornerai.» Ha ragione, in un certo senso."}]},{q:"Una pioggia improvvisa ti spinge sotto una tettoia. Accanto a te c'è il tuo vecchio migliore amico delle medie, che non vedi da anni.",c:[{t:"Vi raccontate tutto, finché smette di piovere",e:{fa:3,a:4},do:()=>addFriend(),r:"Smette di piovere dopo un'ora. Non ve ne accorgete. Vi scambiate i numeri come se fosse ieri."},{t:"Un saluto veloce, un po' imbarazzato",e:{c:2},r:"«Ci sentiamo, eh.» Non vi sentirete. Ma per un momento è stato bello."},{t:"Proponi di andare a prendere un cioccolata",need:4,e:{s:-4,fa:2,a:3},do:()=>addFriend(),r:"Cioccolata densa, vecchi ricordi e risate. Un'amicizia che ricomincia."}]},{q:"Il vento ti porta su un ponte. Sotto passa un fiume calmo. Sul parapetto qualcuno ha attaccato centinaia di bigliettini con dei desideri.",c:[{t:"Scrivi anche tu il tuo desiderio",e:{a:5,fa:1},r:"Lo leghi bene. Non lo dici a nessuno. È così che funziona."},{t:"Ne leggi qualcuno",e:{a:3,c:1},r:"«Vorrei che mia nonna guarisse.» «Vorrei un cane.» «Vorrei vincere al fanta.» L'umanità in un ponte."},{t:"Foto del ponte al tramonto",e:{f:7,T:{insta:5}},r:"I bigliettini colorati controluce. Il post più poetico del tuo profilo."}]},{q:"Un signore in giacca e cravatta sta giocando a scacchi da solo su una panchina. Ti indica la sedia vuota.",c:[{t:"Giochi la partita",ok:()=>S.st.a>=40||Math.random()<.3,e:{a:8,T:{aura:6,crypto:3}},r:"Partita lunga e silenziosa. Pareggio. Ti stringe la mano: «Raro, raro.»",rf:"Scacco matto in 7 mosse. Ti spiega con calma dove hai sbagliato. Lezione gratuita di umiltà.",ef:{a:3}},{t:"Gli chiedi perché gioca da solo",e:{fa:2,a:3},r:"«Aspetto qualcuno da quarant'anni. Oggi sei tu.» Non capisci, ma ti commuovi un po'."},{t:"Fai il tifo senza giocare",e:{f:2},r:"Vince il nero. Cioè lui. Esulta. Contro se stesso."}]},{q:"Senti un profumo di gelsomino e finisci davanti a un giardino segreto tra due palazzi. Una nonna sta annaffiando i fiori.",m:[4,5,6,7,8,9],c:[{t:"Le chiedi se puoi aiutarla",e:{fa:6,a:3},r:"Mezz'ora di annaffiatoio. Alla fine ti regala una piantina di basilico «per la mamma»."},{t:"Ti fermi solo a guardare",e:{a:4,b:4},r:"Profumi, colori, una farfalla. In mezzo al cemento, un angolo di paradiso."},{t:"Le chiedi il nome di ogni fiore",e:{a:3,fa:2},r:"Li conosce tutti, anche in latino. Ti fa una lezione di botanica. Ti piace più di quanto pensassi."}]},{q:"Il vento ti porta a un campetto di basket deserto. A terra c'è un pallone. Sul canestro c'è scritto: «Un tiro. Uno solo.»",c:[{t:"Tiri da lontano",ok:()=>Math.random()<.35+S.T.gym/200,e:{a:8,f:4},r:"Ciuff. Solo rete. Nessuno ti ha visto. Lo sai solo tu, ed è meglio così.",rf:"Il pallone prende il ferro e rotola via. Ma il cuore ti batte forte lo stesso.",ef:{a:2}},{t:"Tiro facile, da sotto",e:{a:3},r:"Canestro. Piccolo, sicuro, onesto."},{t:"Lasci il pallone a chi verrà dopo",e:{a:4},r:"Il tiro è per il prossimo. Ti sembra giusto."}]},{q:"Segui una scia di briciole di pane. Alla fine trovi un piccione enorme, che ti fissa come se stesse aspettando proprio te.",c:[{t:"Lo saluti con un inchino",e:{a:5,f:2},r:"Il piccione fa un passo avanti e un inchino a sua volta. Giuri che è successo davvero. Nessuno ti crede."},{t:"Gli dai il resto del pane",e:{T:{pet:3}},r:"Arrivano altri 40 piccioni. Fuggi."},{t:"Fai la battle di aura col piccione",e:{a:3,T:{aura:4},c:2},r:"Il piccione vince. Di nuovo. È il re della città."}]},{q:"Ti fermi davanti a una vetrina che riflette strano: nel riflesso hai dieci anni in più. Ti fai l'occhiolino da solo.",c:[{t:"Ti chiedi cosa farai a 29 anni",e:{a:6,T:{aura:5}},r:"Pensi a cosa vorresti essere. Non hai una risposta precisa. Ma ti piace la faccia che fai nel riflesso."},{t:"Ti sistemi i capelli e vai avanti",e:{a:2},r:"Era solo il vetro curvo di una gioielleria. Forse."},{t:"Fai una foto al riflesso",e:{f:5,c:2},r:"Nella foto sei normale. Il vetro ha scelto di mostrarlo solo a te."}]},{q:"Il vento ti porta su una collina sopra il paese. Da qui si vedono le luci di casa tua, la piazza, la stazione, il kebab.",w:[2,3],c:[{t:"Ti siedi e guardi per un'ora",e:{a:7,b:6},r:"Il paese sembra piccolissimo, e tu sembri grande. È una sensazione nuova. Te la porti a casa."},{t:"Chiami qualcuno per dirglielo",e:{fa:4},do:()=>{S.partner&&(S.partner.rel=Math.min(100,S.partner.rel+6),S.partner.last=S.day)},r:"Al telefono non trovi le parole giuste. Non importa: dall'altra parte capiscono lo stesso."},{t:"Foto panoramica notturna",e:{f:7,T:{insta:4}},r:"Luci come stelle a terra. Una delle foto più belle che hai mai fatto."}]},{q:"In mezzo alla piazza vuota trovi un pianoforte a coda. Nessuno intorno. Un cartello dice: «Suonami».",c:[{t:"Suoni l'unica canzone che sai",e:{a:5,f:4},r:"«Fra Martino» con due dita. Dalle finestre qualcuno applaude. È il tuo concerto."},{t:"Aspetti che arrivi qualcuno a suonare",e:{a:4,b:4},r:"Dopo mezz'ora arriva un ragazzino che suona Chopin. Rimani a bocca aperta."},{t:"Fai il video del pianoforte vuoto",e:{f:6,T:{insta:4}},r:"«Il pianoforte che aspetta.» I commenti propongono canzoni. Domani qualcuno le suonerà."}]},{q:"Il vento ti porta davanti a una porta socchiusa da cui esce odore di sugo. Una voce dall'interno: «Sei arrivat{GO}? A tavola!»",w:[1,2],c:[{t:"Entri, per curiosità",e:{fa:3,b:10,c:2},r:"Una famiglia intera ti accoglie come se fossi atteso. Mangi lasagne. Solo alla fine capiscono che aspettavano un altro. Ti danno comunque il dolce."},{t:"Rispondi che hanno sbagliato persona",e:{a:3},r:"Ridono, ti invitano lo stesso «per la prossima domenica». Forse ci andrai."},{t:"Annusi e vai avanti, affamat{GO}",e:{b:-4},r:"Corri a casa a fare un piatto di pasta. Non è la stessa cosa. Ma ci provi."}]},{q:"Un ragazzo con una macchina fotografica a pellicola ti chiede se può farti un ritratto. «Mi piace la luce che hai addosso.»",c:[{t:"Accetti e posi in modo naturale",e:{f:5,a:5},r:"Uno scatto solo. «Te lo mando quando lo sviluppo.» Tre settimane dopo ti arriva una foto bellissima. Non sembri tu. Sei tu."},{t:"Fai la posa da sigma",e:{f:4,c:3,T:{maranza:3}},r:"Sospira e scatta lo stesso. La foto è ridicola. La appendi in camera."},{t:"Gli chiedi di fargli tu una foto",e:{a:4,fa:1},r:"Lui ride: «Nessuno me l'aveva mai chiesto.» Gli fai una foto con il tuo telefono. Si commuove."}]}],EVW_REG={lombardia:[{q:"La nebbia è così fitta che ti perdi nel tuo paese. Quando si dirada sei davanti a una cascina antica, con una {SCIURA} che fa la polenta nel paiolo.",m:[10,11,12,1,2],c:[{t:"Ti fermi a mangiare",e:{fa:4,b:10},r:"Polenta e formaggio fuso, accanto al camino. «Da dove arrivi?» «Dalla nebbia.» Lei annuisce: capisce."},{t:"Chiedi la strada per tornare",e:{a:2},r:"«Segui la roggia.» Non sai cos'è una roggia. La segui lo stesso. Funziona."},{t:"Foto della cascina nella nebbia",e:{f:7,T:{insta:5}},r:"Sembra un quadro dell'Ottocento. Nessuno capisce dove sia. Nemmeno tu."}]}],veneto:[{q:"Il vento ti porta in un bacaro nascosto dietro una calle. L'oste ti riconosce: «Ciò, ti xe el nipote de chi?» Non vi siete mai visti.",c:[{t:"Dici il cognome dei tuoi",e:{fa:4,a:3},r:"«Ah! Me ricordo to nonno!» Cicchetto offerto e una storia sul nonno che non conoscevi."},{t:"«Sono di passaggio»",e:{a:3},r:"«Qua nissun xe de passagio.» Ti fa sedere e ti racconta la storia del locale."},{t:"Ordini un'ombra di succo d'uva",need:2,e:{s:-2,fa:2},r:"L'oste ride e te la serve nel bicchiere buono. Rispetto."}]}],piemonte:[{q:"Seguendo l'odore di nocciole tostate arrivi a una piccola fabbrica di gianduiotti aperta per errore. Il pasticcere ti guarda: «Lei chi è, neh?»",c:[{t:"Ti presenti con educazione",e:{a:4,fa:2},r:"Ti offre un gianduiotto appena fatto. «Non dica a nessuno che è entrato, neh.» Non lo dirai."},{t:"Chiedi la ricetta segreta",e:{c:2},r:"Sorriso piemontese. Silenzio. Cambio di argomento sul meteo."},{t:"Compri una scatola per la nonna",need:8,e:{s:-8,fa:8},r:"La nonna la apre, ne mangia tre, e nasconde il resto. Classico."}]}],lazio:[{q:"Il vento ti porta in una piazzetta di {METRO} che non c'è sulle mappe. Un signore ti offre un supplì: «Daje, che te lo meriti.»",c:[{t:"Lo accetti",e:{b:8,fa:2},r:"Filo di mozzarella lungo un metro. «Hai visto? Se chiama supplì ar telefono.» Lo sapevi, ma fai finta di no."},{t:"Gli chiedi perché te lo meriti",e:{a:4},r:"«Perché sei passat{GO} de qua. Mica ce passa nessuno.»"},{t:"Foto della piazzetta",e:{f:7,T:{insta:5}},r:"Edera, fontanella, un gatto sul muretto. Tutti ti chiedono dov'è. Non lo dirai mai."}]}],campania:[{q:"Seguendo un mandolino arrivi in un vicolo dove una nonna stende i panni e canta. I panni formano un arcobaleno sopra la tua testa.",c:[{t:"Canti con lei",e:{fa:4,a:4},r:"Non sai le parole, ma lei ti insegna il ritornello. Dai balconi cantano anche i vicini."},{t:"Le offri un caffè al bar sotto",need:2,e:{s:-2,fa:6},r:"Lei accetta, poi lo paga lei. «Che bella creatura.» Ti tiene a braccetto fino al bar."},{t:"Foto dell'arcobaleno di panni",e:{f:8,T:{insta:5}},r:"La foto più colorata del tuo profilo. «Napoli in una foto», scrive qualcuno."}]}],calabria:[{q:"Il vento ti porta su una spiaggia deserta al tramonto. Un pescatore ripara le reti e ti fa cenno di sederti.",c:[{t:"Ti siedi e lo aiuti",e:{fa:3,a:5},r:"Ti insegna un nodo che conosce da sessant'anni. Alla fine ti regala due pesci per cena."},{t:"Gli chiedi della sua vita",e:{a:4,fa:2},r:"Ti racconta di tempeste, di amori e di un pesce spada «grande come una barca». Forse esagera. Non importa."},{t:"Guardi il mare in silenzio",e:{a:6,b:6},r:"Il sole scende dietro le isole lontane. Il pescatore dice solo: «Bellu.» Basta così."}]}],sici ccedere ad account altrui; manomettere, decompilare o aggirare le protezioni del Gioco, salvo nei limiti consentiti dalla legge; usare programmi automatici per ottenere vantaggi o premi. In caso di violazione possiamo sospendere o chiudere l'account."],["6. Valuta di gioco, premi e contenuti acquistabili","Soldi, follower e oggetti del Gioco sono virtuali, non hanno valore reale e non sono convertibili in denaro. Se in futuro saranno disponibili contenuti a pagamento (per esempio skin), prezzo, caratteristiche e condizioni saranno indicati prima dell'acquisto. Per i contenuti digitali forniti subito dopo l'acquisto, il diritto di recesso si perde solo se lo accetti espressamente al momento dell'acquisto, come previsto dal Codice del Consumo."],["7. Pubblicità","Il Gioco è gratuito grazie alla pubblicità: video facoltativi con premio e una pubblicità a schermo intero ogni 2-3 settimane di gioco. Non ci sono banner fissi. Il tipo di pubblicità dipende dalle tue scelte sul consenso, che puoi cambiare dal menu in qualsiasi momento."],["8. Proprietà intellettuale","Grafica, testi, codice e marchio del Gioco appartengono al Titolare o ai suoi licenzianti. Ti concediamo una licenza personale, non esclusiva e non trasferibile per usare il Gioco a scopo privato."],["9. Disponibilità e responsabilità","Il Gioco è fornito «così com'è». Facciamo il possibile per farlo funzionare bene, ma non garantiamo che sia sempre disponibile o privo di errori. Nei limiti previsti dalla legge non rispondiamo di danni indiretti; restano salvi i diritti che la legge riconosce ai consumatori, che questi termini non limitano."],["10. Modifiche","Possiamo aggiornare il Gioco e questi termini. Le modifiche importanti ti verranno comunicate nel Gioco prima che diventino efficaci; se non le accetti puoi smettere di usarlo ed eliminare l'account."],["11. Legge applicabile e reclami","Si applica la legge italiana. Per i consumatori è competente il tribunale del luogo di residenza o domicilio del consu
